<template id="tpl-LeaveHistory">
    <!DOCTYPE html>
    <html>
    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <style>
        :root {
          --mr-primary: #0066FF;
          --mr-primary-dark: #0052CC;
          --mr-bg: #F8FAFC;
          --mr-card-bg: #FFFFFF;
          --mr-border: #E2E8F0;
          --mr-text-main: #0F172A;
          --mr-text-sub: #64748B;
          --mr-text-muted: #94A3B8;
          --mr-success: #10B981;
          --mr-success-bg: #E3F8EE;
          --mr-warning: #F59E0B;
          --mr-warning-bg: #FEF3C7;
          --mr-danger: #EF4444;
          --mr-danger-bg: #FEE2E2;
        }

        * { box-sizing: border-box; -ms-overflow-style: none !important; scrollbar-width: none !important; }
        *::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }

        body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: var(--mr-bg);
          display: flex;
          justify-content: center;
          align-items: stretch;
          padding: 0;
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
          -webkit-font-smoothing: antialiased;
        }

        .device {
          width: 100%;
          max-width: 440px;
          height: 100vh;
          height: 100dvh;
          background: var(--mr-bg);
          border-radius: 0;
          border: none;
          overflow: hidden;
          position: relative;
          display: flex;
          flex-direction: column;
          margin: 0 auto;
        }

        @media (min-width: 769px) {
          body { background: #0e1420; padding: 15px 0; align-items: center; }
          .device { border-radius: 40px; border: 8px solid #1f2937; height: 844px; box-shadow: 0 20px 40px rgba(0,0,0,.4); }
        }

        .screen,
        .screen.has-mr-header,
        .screen.has-al-header,
        #my-requests-screen {
          flex: 1;
          overflow-y: auto;
          padding-top: 0 !important;
          padding-bottom: 96px;
          margin-top: 0 !important;
          -webkit-overflow-scrolling: touch;
          background: var(--mr-bg);
          position: relative;
        }

        /* Header Card Banner matching Image 2 */
        .mr-header-banner,
            .lb-header-banner {
          position: relative;
          width: 100%;
          margin: 0 !important;
          margin-top: 0 !important;
          padding: 0 !important;
          border-top-left-radius: 0 !important;
          border-top-right-radius: 0 !important;
          border-bottom-left-radius: 28px;
          border-bottom-right-radius: 28px;
          overflow: hidden;
          box-shadow: 0 10px 28px rgba(0, 102, 255, 0.22);
          background: linear-gradient(135deg, #005CE6 0%, #0066FF 50%, #0050EA 100%);
          line-height: 0;
          aspect-ratio: 593 / 191;
        }

        .mr-header-banner-img {
          width: 100%;
          height: 100%;
          display: block;
          border-bottom-left-radius: 28px;
          border-bottom-right-radius: 28px;
          object-fit: cover;
          pointer-events: none;
        }

        /* Clickable Back Button Hitbox precisely matching Image 2 back button */
        .mr-back-btn {
          position: absolute;
          left: 8.26%;
          top: 45.5%;
          transform: translate(-50%, -50%);
          width: 44px;
          height: 44px;
          border-radius: 50%;
          background: transparent;
          border: none;
          cursor: pointer;
          z-index: 10;
          padding: 0;
          margin: 0;
          outline: none;
          -webkit-tap-highlight-color: transparent;
          transition: background 0.2s ease, transform 0.15s ease;
        }

        .mr-back-btn:hover {
          background: rgba(255, 255, 255, 0.2);
          transform: translate(-50%, -50%) scale(1.08);
        }

        .mr-back-btn:active {
          transform: translate(-50%, -50%) scale(0.92);
          background: rgba(255, 255, 255, 0.3);
        }

        .mr-back-btn:focus-visible {
          outline: 2px solid #FFFFFF;
          outline-offset: 2px;
        }

        /* Filter Segment Bar */
        .mr-filter-bar {
          display: flex;
          background: #EEF2F6;
          border-radius: 16px;
          padding: 4px;
          margin: 16px 18px 16px 18px;
          gap: 4px;
          box-sizing: border-box;
        }

        .mr-filter-pill {
          flex: 1;
          text-align: center;
          padding: 9px 0;
          border-radius: 12px;
          font-size: 13.5px;
          font-weight: 600;
          color: #475569;
          background: transparent;
          cursor: pointer;
          border: none;
          user-select: none;
          transition: all 0.2s ease;
        }

        .mr-filter-pill.active {
          background: #0066FF;
          color: #FFFFFF;
          font-weight: 700;
          box-shadow: 0 4px 12px rgba(0, 102, 255, 0.28);
        }

        /* Empty State Matching Image 2 */
        .mr-empty-state {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 30px 24px 20px;
          text-align: center;
        }

        .mr-empty-art-wrap {
          width: 250px;
          max-width: 80%;
          margin-bottom: 16px;
          display: flex;
          justify-content: center;
        }

        .mr-empty-art-img {
          width: 100%;
          max-width: 240px;
          height: auto;
          object-fit: contain;
          display: block;
        }

        .mr-empty-title {
          font-size: 20px;
          font-weight: 800;
          color: #0F172A;
          margin: 0 0 6px 0;
          letter-spacing: -0.2px;
        }

        .mr-empty-sub {
          font-size: 13.5px;
          color: #64748B;
          line-height: 1.5;
          margin: 0 0 22px 0;
          text-align: center;
        }

        .mr-apply-action-btn {
          background: #0066FF;
          color: #FFFFFF;
          border: none;
          border-radius: 999px;
          padding: 12px 28px;
          font-size: 14.5px;
          font-weight: 700;
          cursor: pointer;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          box-shadow: 0 6px 20px rgba(0, 102, 255, 0.35);
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .mr-apply-action-btn:hover {
          transform: translateY(-2px);
          box-shadow: 0 8px 24px rgba(0, 102, 255, 0.45);
        }

        /* Request Cards (When requests exist) */
        .mr-card {
          background: #FFFFFF;
          border: 1px solid rgba(226, 232, 240, 0.85);
          border-radius: 18px;
          padding: 16px;
          margin: 0 16px 14px 16px;
          box-shadow: 0 4px 16px rgba(15, 30, 80, 0.04);
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .mr-card:hover {
          box-shadow: 0 6px 20px rgba(15, 30, 80, 0.07);
        }

        .mr-card-top {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
        }

        .mr-card-left {
          display: flex;
          gap: 12px;
          flex: 1;
          padding-right: 8px;
        }

        .mr-card-icon-wrap {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          font-size: 18px;
          font-weight: 800;
          flex-shrink: 0;
        }

        .mr-card-icon-wrap.success { background: #E3F8EE; color: #10B981; }
        .mr-card-icon-wrap.warning { background: #FEF3C7; color: #F59E0B; }
        .mr-card-icon-wrap.danger { background: #FEE2E2; color: #EF4444; }

        .mr-card-title {
          font-size: 16px;
          font-weight: 800;
          color: #0F172A;
          margin: 0;
          line-height: 1.3;
        }

        .mr-card-date {
          font-size: 12.5px;
          color: #64748B;
          margin: 3px 0 0 0;
          font-weight: 500;
        }

        .mr-badge {
          display: inline-block;
          padding: 4px 12px;
          border-radius: 999px;
          font-size: 11.5px;
          font-weight: 700;
        }

        .mr-badge.success { background: #E3F8EE; color: #10B981; }
        .mr-badge.warning { background: #FEF3C7; color: #F59E0B; }
        .mr-badge.danger { background: #FEE2E2; color: #EF4444; }

        .mr-card-divider {
          height: 1px;
          background: #E2E8F0;
          margin: 12px 0;
        }

        .mr-card-footer {
          display: flex;
          justify-content: space-between;
          align-items: center;
        }

        .mr-card-remark {
          color: #64748B;
          font-style: italic;
          font-size: 12.5px;
          margin: 0;
          flex: 1;
        }

        .mr-view-btn {
          background: none;
          border: none;
          color: #0066FF;
          font-weight: 700;
          font-size: 12.5px;
          cursor: pointer;
          white-space: nowrap;
          padding: 0;
          margin-left: 8px;
        }

        /* Expanded Tracking & Details */
        .mr-expanded {
          margin-top: 12px;
          border-top: 1px solid #E2E8F0;
          padding-top: 12px;
          display: none;
        }

        .mr-section-label {
          font-size: 11px;
          font-weight: 800;
          color: #94A3B8;
          letter-spacing: 0.6px;
          margin: 0 0 10px;
        }

        /* Tracker stepper */
        .tracker { display: flex; flex-direction: column; margin-bottom: 12px; }
        .tracker-step { display: flex; align-items: flex-start; min-height: 48px; }
        .tracker-dot-col { display: flex; flex-direction: column; align-items: center; width: 26px; margin-right: 12px; flex-shrink: 0; }
        .tracker-dot { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #C6CCD6; background: #fff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 800; flex-shrink: 0; z-index: 1; }
        .tracker-dot.done-ok { background: #10B981; border-color: #10B981; color: #fff; }
        .tracker-dot.done-no { background: #EF4444; border-color: #EF4444; color: #fff; }
        .tracker-dot.active { background: #EEF4FF; border-color: #0066FF; border-width: 2.5px; }
        .tracker-dot.active::after { content: ''; width: 7px; height: 7px; border-radius: 50%; background: #0066FF; }
        .tracker-line { width: 2px; flex: 1; min-height: 20px; background: #E7EAF0; margin: 2px 0; }
        .tracker-line.ok { background: #BBEDD6; }
        .tracker-line.no { background: #FBCECE; }
        .tracker-labels { flex: 1; padding-bottom: 8px; }
        .tracker-title { font-size: 13px; font-weight: 700; color: #0F172A; }
        .tracker-title.muted { color: #94A3B8; }
        .tracker-title.blue { color: #0066FF; }
        .tracker-title.green { color: #10B981; }
        .tracker-title.red { color: #EF4444; }
        .tracker-sub { font-size: 11px; color: #64748B; margin-top: 1px; }
        .tracker-chip { align-self: flex-start; padding-top: 2px; }
        .chip { padding: 3px 9px; border-radius: 999px; font-size: 10px; font-weight: 700; }
        .chip-pending { background: #FEF3C7; color: #F59E0B; }
        .chip-approved { background: #E3F8EE; color: #10B981; }
        .chip-rejected { background: #FEE2E2; color: #EF4444; }

        /* Detail grid */
        .detail-sep { height: 1px; background: #E2E8F0; margin: 10px 0; }
        .detail-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
        .detail-label { font-size: 12px; color: #64748B; font-weight: 600; }
        .detail-value { font-size: 13px; color: #0F172A; font-weight: 700; text-align: right; max-width: 55%; }
        .detail-block { margin-top: 8px; }
        .detail-block-label { font-size: 11px; font-weight: 700; color: #94A3B8; margin-bottom: 4px; display: block; }
        .detail-block-text { background: #F8FAFC; border: 1px solid #E2E8F0; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #0F172A; }
        .detail-block-hl { background: #EEF4FF; border-radius: 8px; padding: 8px 10px; font-size: 12px; color: #0066FF; font-weight: 600; }

        /* Bottom Nav Styles */
        .bottom-nav {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          background: #FFFFFF;
          border-top: 1px solid #EAEFF5;
          border-radius: 24px 24px 0 0;
          padding: 8px 12px 14px;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03);
          z-index: 100;
          box-sizing: border-box;
          height: 68px;
        }

        .bottom-nav .tab,
        .nav-tab {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: #64748B;
          font-size: 11px;
          font-weight: 500;
          gap: 3px;
          user-select: none;
        }

        .bottom-nav .tab.active,
        .nav-tab.active {
          color: #0066FF;
          font-weight: 700;
        }

        .nav-pill-wrap {
          background: #EEF4FF;
          border-radius: 16px;
          padding: 6px 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 1px;
        }

        .active-dot-indicator {
          width: 4px;
          height: 4px;
          border-radius: 2px;
          background: #0066FF;
          margin-top: 1px;
        }

        .nav-apply-btn-wrap {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          user-select: none;
          margin-top: -14px;
        }

        .nav-apply-circle {
          width: 48px;
          height: 48px;
          border-radius: 24px;
          background: #0066FF;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 6px 16px rgba(0, 102, 255, 0.4);
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-apply-btn-wrap:hover .nav-apply-circle {
          transform: scale(1.05);
          box-shadow: 0 8px 20px rgba(0, 102, 255, 0.5);
        }

        .nav-apply-label {
          font-size: 11px;
          font-weight: 700;
          color: #1E293B;
          margin-top: 4px;
        }
      </style>
    </head>
    <body>
      <div class="device">
        <div class="screen has-mr-header has-al-header" id="my-requests-screen">
          
          <!-- Royal Blue Gradient Header Banner matching Image 2 -->
          <div class="mr-header-banner" id="mr-header-banner">
            <img 
              src="assets/requests-header-banner.png" 
              alt="My Requests - Track your leaves &amp; permissions" 
              class="mr-header-banner-img" 
              onerror="this.onerror=null; this.src='EmergereApp/EmergereApp/assets/requests-header-banner.png';"
            />
            <button 
              class="mr-back-btn" 
              onclick="handleRequestsBackNav()" 
              title="Go Back" 
              aria-label="Go Back"
            >
              <span style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">Go Back</span>
            </button>
          </div>

          <!-- Filter Segment Bar matching Image 2 -->
          <div class="mr-filter-bar">
            <button class="mr-filter-pill active" onclick="filterTab('all', this)">All</button>
            <button class="mr-filter-pill" onclick="filterTab('leaves', this)">Leaves</button>
            <button class="mr-filter-pill" onclick="filterTab('permissions', this)">Permissions</button>
          </div>

          <!-- Requests / Empty State Container -->
          <div id="cards-container"></div>
        </div>

        <!-- Bottom Navigation Bar matching Image 2 -->
        <div class="bottom-nav">
          <div class="tab nav-tab" id="tab-dashboard" onclick="handleDashboardNav()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Dashboard</span>
          </div>
          <div class="tab nav-tab" id="tab-attendance" onclick="handleAttendanceNav()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Attendance</span>
          </div>
          <div class="tab nav-apply-btn-wrap" id="tab-apply" onclick="handleApplyNav()">
            <div class="nav-apply-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </div>
            <span class="nav-apply-label">Apply</span>
          </div>
          <div class="tab nav-tab active" id="tab-history">
            <div class="nav-pill-wrap">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#0066FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <path d="M3 3v5h5"></path>
                <polyline points="12 7 12 12 15 15"></polyline>
              </svg>
            </div>
            <span>History</span>
            <span class="active-dot-indicator"></span>
          </div>
          <div class="tab nav-tab" id="tab-profile" onclick="handleProfileNav()">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
          </div>
        </div>
      </div>

      <script>
        var currentTab = 'all';

        function pWin() {
          try { return window.parent && window.parent !== window ? window.parent : window; } catch(e) { return window; }
        }

        function handleRequestsBackNav() {
          var pw = pWin();
          if (pw.loadScreen) pw.loadScreen('tpl-EmployeeDashboard');
          else if (typeof loadScreen === 'function') loadScreen('tpl-EmployeeDashboard');
          else if (window.history && window.history.length > 1) window.history.back();
          else window.location.href = '../EmployeeDashboard/preview.html';
        }

        function handleDashboardNav() {
          var pw = pWin();
          if (pw.loadScreen) pw.loadScreen('tpl-EmployeeDashboard');
          else if (typeof loadScreen === 'function') loadScreen('tpl-EmployeeDashboard');
          else window.location.href = '../EmployeeDashboard/preview.html';
        }

        function handleAttendanceNav() {
          var pw = pWin();
          if (pw.loadScreen) pw.loadScreen('tpl-MyAttendance');
          else if (typeof loadScreen === 'function') loadScreen('tpl-MyAttendance');
          else window.location.href = '../MyAttendance/preview.html';
        }

        function handleApplyNav() {
          var pw = pWin();
          if (pw.loadScreen) pw.loadScreen('tpl-ApplyLeave');
          else if (typeof loadScreen === 'function') loadScreen('tpl-ApplyLeave');
          else window.location.href = '../ApplyLeave/preview.html';
        }

        function handleProfileNav() {
          var pw = pWin();
          if (pw.loadScreen) pw.loadScreen('tpl-MyProfile');
          else if (typeof loadScreen === 'function') loadScreen('tpl-MyProfile');
          else window.location.href = '../MyProfile/preview.html';
        }

        function handleEmptyActionClick() {
          if (currentTab === 'permissions') {
            var pw = pWin();
            if (pw.loadScreen) pw.loadScreen('tpl-ApplyPermission');
            else if (typeof loadScreen === 'function') loadScreen('tpl-ApplyPermission');
            else window.location.href = '../ApplyPermission/preview.html';
          } else {
            handleApplyNav();
          }
        }

        function filterTab(t, btn) {
          currentTab = t;
          document.querySelectorAll('.mr-filter-pill').forEach(function(b) {
            b.classList.remove('active');
          });
          if (btn) btn.classList.add('active');
          renderCards();
        }

        function getRequests() {
          var pw = pWin();
          return (pw.EMP_LEAVE_REQUESTS || []).slice();
        }

        function statusInfo(raw) {
          var s = (raw || 'pending').toLowerCase();
          if (s === 'approved') return { label:'Approved', tone:'success', icon:'✓', iconColor:'#10B981' };
          if (s === 'rejected') return { label:'Rejected', tone:'danger', icon:'✕', iconColor:'#EF4444' };
          return { label:'Pending', tone:'warning', icon:'⏱', iconColor:'#F59E0B' };
        }

        function formatDate(d) {
          if (!d) return '';
          var monthMap = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          var m = String(d).match(/^(d{1,2})-([A-Za-z]{3})-(d{4})$/);
          if (m) return m[2] + ' ' + String(m[1]).padStart(2,'0') + ', ' + m[3];
          var m2 = String(d).match(/^(d{4})-(d{2})-(d{2})$/);
          if (m2) return monthMap[parseInt(m2[2],10)-1] + ' ' + m2[3] + ', ' + m2[1];
          return d;
        }

        function escHtml(s) {
          return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
        }

        function buildCard(req, idx) {
          var isPermission = !!(req.isPermission || req.permissionType || ['Early Going','Late Coming','Personal Work','Official Work'].indexOf(req.leaveType || req.type || '') !== -1);
          var si = statusInfo(req.status);
          var title = isPermission ? ('Permission (' + (req.leaveType || req.type || req.permissionType || 'Permission') + ')') : (req.leaveType || req.type || 'Leave');
          var displayDate = formatDate(req.fromDate || req.date || '');
          var timeSlot = (req.startTime && req.endTime) ? (req.startTime + ' - ' + req.endTime) : (req.schedule || '');
          var dateText = (isPermission && timeSlot) ? displayDate + ' • ' + timeSlot : displayDate;
          var duration = req.daysText || req.totalDays || req.duration || (isPermission ? '2 Hours' : '1.0 Day');
          var appliedDate = req.appliedDate || req.submittedAt || 'Applied';
          var approverName = req.approverName || (req.approvingManager ? req.approvingManager.replace(' (Reporting Manager)','') : 'Manager');
          var reason = req.reason || 'Personal work';
          var approverComments = req.approverComments || req.remarks || '';
          var remark = req.remark || (si.label === 'Approved' ? 'Approved by ' + approverName + '.' : si.label === 'Rejected' ? 'Rejected by ' + approverName + '.' : 'Sent to ' + approverName + ' for review.');
          var supportingDocs = req.supportingDocs || 'None Attached';
          var category = isPermission ? 'permissions' : 'leaves';

          var isApproved = si.label === 'Approved';
          var isRejected = si.label === 'Rejected';
          var isDecided = isApproved || isRejected;

          var stage1DotClass = 'done-ok';
          var stage1Line = isDecided ? (isRejected ? 'no' : 'ok') : '';
          var stage2DotClass = isDecided ? (isRejected ? 'done-no' : 'done-ok') : 'active';
          var stage2TitleClass = isDecided ? (isRejected ? 'red' : 'green') : 'blue';
          var stage2Line = isDecided ? (isRejected ? 'no' : 'ok') : '';
          var stage3DotClass = isDecided ? (isRejected ? 'done-no' : 'done-ok') : '';
          var stage3TitleClass = isDecided ? (isRejected ? 'red' : 'green') : 'muted';
          var stage3ChipHtml = isDecided
            ? (isRejected ? '<span class="chip chip-rejected">✕ Rejected</span>' : '<span class="chip chip-approved">✓ Approved</span>')
            : '<span class="chip chip-pending">Awaiting</span>';

          var approverCommentHtml = approverComments
            ? '<div class="detail-block"><span class="detail-block-label">Approver Comments</span><div class="detail-block-hl">' + escHtml(approverComments) + '</div></div>'
            : '';

          var timeRow = (isPermission && timeSlot)
            ? '<div class="detail-row"><span class="detail-label">Start &amp; End Time</span><span class="detail-value">' + escHtml(timeSlot) + '</span></div>'
            : '';

          return '<div class="mr-card card" data-type="' + category + '" data-idx="' + idx + '">' +
            '<div class="mr-card-top req-row">' +
              '<div class="mr-card-left req-left">' +
                '<div class="mr-card-icon-wrap ' + si.tone + '">' + si.icon + '</div>' +
                '<div><p class="mr-card-title req-title">' + escHtml(title) + '</p><p class="mr-card-date req-date">' + escHtml(dateText) + '</p></div>' +
              '</div>' +
              '<span class="mr-badge badge ' + si.tone + '">' + si.label + '</span>' +
            '</div>' +
            '<div class="mr-card-divider divider"></div>' +
            '<div class="mr-card-footer footer-row">' +
              '<p class="mr-card-remark remark">Remarks: ' + escHtml(remark) + '</p>' +
              '<button class="mr-view-btn view-btn" onclick="toggleExpand(this)">View Details ›</button>' +
            '</div>' +
            '<div class="mr-expanded expanded">' +
              '<p class="mr-section-label section-label">REQUEST TRACKING</p>' +
              '<div class="tracker">' +
                '<div class="tracker-step">' +
                  '<div class="tracker-dot-col"><div class="tracker-dot done-ok">✓</div><div class="tracker-line ' + stage1Line + '"></div></div>' +
                  '<div class="tracker-labels"><div class="tracker-title">Applied</div><div class="tracker-sub">' + escHtml(appliedDate) + '</div></div>' +
                '</div>' +
                '<div class="tracker-step">' +
                  '<div class="tracker-dot-col"><div class="tracker-dot ' + stage2DotClass + '">' + (isDecided ? (isRejected ? '✕' : '✓') : '') + '</div><div class="tracker-line ' + stage2Line + '"></div></div>' +
                  '<div class="tracker-labels"><div class="tracker-title ' + stage2TitleClass + '">Pending with Manager</div><div class="tracker-sub">' + escHtml(approverName) + '</div></div>' +
                '</div>' +
                '<div class="tracker-step">' +
                  '<div class="tracker-dot-col"><div class="tracker-dot ' + stage3DotClass + '">' + (isDecided ? (isRejected ? '✕' : '✓') : '') + '</div></div>' +
                  '<div class="tracker-labels" style="flex:1"><div class="tracker-title ' + stage3TitleClass + '">' + (isRejected ? 'Rejected' : 'Approved') + '</div><div class="tracker-sub">' + (isDecided ? 'By ' + escHtml(approverName) : 'Awaiting decision') + '</div></div>' +
                  '<div class="tracker-chip">' + stage3ChipHtml + '</div>' +
                '</div>' +
              '</div>' +
              '<div class="detail-sep"></div>' +
              '<p class="mr-section-label section-label">COMPLETE REQUEST DETAILS</p>' +
              '<div class="detail-row"><span class="detail-label">Request Type</span><span class="detail-value">' + (isPermission ? 'Permission' : 'Leave') + '</span></div>' +
              '<div class="detail-row"><span class="detail-label">Category</span><span class="detail-value">' + escHtml(title) + '</span></div>' +
              '<div class="detail-row"><span class="detail-label">Date</span><span class="detail-value">' + escHtml(displayDate) + '</span></div>' +
              timeRow +
              '<div class="detail-row"><span class="detail-label">' + (isPermission ? 'Duration' : 'Number of Days') + '</span><span class="detail-value">' + escHtml(duration) + '</span></div>' +
              '<div class="detail-row"><span class="detail-label">Applied Date</span><span class="detail-value">' + escHtml(appliedDate) + '</span></div>' +
              '<div class="detail-row"><span class="detail-label">Approval Status</span><span class="mr-badge badge ' + si.tone + '" style="font-size:11px;padding:3px 10px;">' + si.label + '</span></div>' +
              '<div class="detail-row"><span class="detail-label">Approver / Manager</span><span class="detail-value">' + escHtml(approverName) + '</span></div>' +
              '<div class="detail-block"><span class="detail-block-label">Reason / Comments</span><div class="detail-block-text">' + escHtml(reason) + '</div></div>' +
              approverCommentHtml +
              '<div class="detail-block"><span class="detail-block-label">Supporting Documents</span><div class="detail-block-text">📎 ' + escHtml(supportingDocs) + '</div></div>' +
            '</div>' +
          '</div>';
        }

        function renderCards() {
          var reqs = getRequests();
          var container = document.getElementById('cards-container');
          if (!container) return;

          var filtered = reqs.filter(function(r) {
            var isPerm = !!(r.isPermission || r.permissionType || ['Early Going','Late Coming','Personal Work','Official Work'].indexOf(r.leaveType || r.type || '') !== -1);
            if (currentTab === 'leaves') return !isPerm;
            if (currentTab === 'permissions') return isPerm;
            return true;
          });

          if (filtered.length === 0) {
            container.innerHTML = '<div class="mr-empty-state empty-state">' +
              '<div class="mr-empty-art-wrap">' +
                '<img src="assets/empty-requests-art.png" alt="No requests yet" class="mr-empty-art-img" onerror="this.onerror=null; this.src=\'EmergereApp/EmergereApp/assets/empty-requests-art.png\'; if(!this.complete){this.style.display=\'none\'; var svgEl=document.getElementById(\'mr-empty-svg-art\'); if(svgEl) svgEl.style.display=\'block\';}" />' +
                '<svg id="mr-empty-svg-art" style="display:none; width:220px; height:180px;" viewBox="0 0 260 210" fill="none" xmlns="http://www.w3.org/2000/svg">' +
                  '<circle cx="130" cy="105" r="75" fill="#EFF6FF"/>' +
                  '<circle cx="130" cy="105" r="74" stroke="#93C5FD" stroke-width="1.5" stroke-dasharray="4 4"/>' +
                  '<path d="M72 135C62 115 72 90 92 85C88 105 82 125 72 135Z" fill="#BFDBFE"/>' +
                  '<path d="M188 135C198 115 188 90 168 85C172 105 178 125 188 135Z" fill="#BFDBFE"/>' +
                  '<rect x="96" y="55" width="68" height="92" rx="10" fill="#3B82F6"/>' +
                  '<rect x="100" y="59" width="60" height="84" rx="8" fill="#FFFFFF"/>' +
                  '<rect x="114" y="48" width="32" height="14" rx="5" fill="#1D4ED8"/>' +
                  '<line x1="112" y1="78" x2="148" y2="78" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>' +
                  '<line x1="112" y1="90" x2="148" y2="90" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>' +
                  '<line x1="112" y1="102" x2="140" y2="102" stroke="#93C5FD" stroke-width="3" stroke-linecap="round"/>' +
                  '<circle cx="152" cy="132" r="22" fill="#FFFFFF"/>' +
                  '<circle cx="152" cy="132" r="18" fill="#EFF6FF"/>' +
                  '<path d="M145 124H159L152 132L159 140H145L152 132Z" stroke="#0066FF" stroke-width="2.2" stroke-linejoin="round" fill="none"/>' +
                '</svg>' +
              '</div>' +
              '<h2 class="mr-empty-title empty-title">No requests yet</h2>' +
              '<p class="mr-empty-sub empty-sub">' + (currentTab === 'permissions' ? 'Apply for a permission to see it here.' : currentTab === 'leaves' ? 'Apply for leave to see it here.' : 'Submit a leave or permission request<br/>to see it here.') + '</p>' +
              '<button class="mr-apply-action-btn empty-btn" onclick="handleEmptyActionClick()">' +
                '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>' +
                '<span>' + (currentTab === 'permissions' ? 'Apply Permission' : 'Apply Leave') + '</span>' +
              '</button>' +
            '</div>';
            return;
          }

          var expandedSet = {};
          container.querySelectorAll('.card').forEach(function(c) {
            var exp = c.querySelector('.expanded');
            if (exp && exp.style.display === 'block') expandedSet[c.getAttribute('data-idx')] = true;
          });

          var html = '';
          reqs.forEach(function(r, i) {
            var isPerm = !!(r.isPermission || r.permissionType || ['Early Going','Late Coming','Personal Work','Official Work'].indexOf(r.leaveType || r.type || '') !== -1);
            var matchTab = currentTab === 'all' || (currentTab === 'leaves' && !isPerm) || (currentTab === 'permissions' && isPerm);
            if (matchTab) html += buildCard(r, i);
          });
          container.innerHTML = html;

          container.querySelectorAll('.card').forEach(function(c) {
            var exp = c.querySelector('.expanded');
            if (!exp) return;
            if (expandedSet[c.getAttribute('data-idx')]) {
              exp.style.display = 'block';
              var btn = c.querySelector('.view-btn');
              if (btn) btn.textContent = 'Hide Details ∧';
            } else {
              exp.style.display = 'none';
            }
          });
        }

        function toggleExpand(btn) {
          var card = btn.closest('.card');
          if (!card) return;
          var exp = card.querySelector('.expanded');
          if (!exp) return;
          if (exp.style.display === 'block') {
            exp.style.display = 'none';
            btn.textContent = 'View Details ›';
          } else {
            exp.style.display = 'block';
            btn.textContent = 'Hide Details ∧';
          }
        }

        // Initial render
        renderCards();

        // Auto-refresh every 1.2 seconds to pick up manager decisions
        setInterval(renderCards, 1200);
      </script>
    </body>
    </html>
