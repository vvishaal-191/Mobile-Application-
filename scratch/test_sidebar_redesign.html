<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sidebar Redesign Test</title>
  <style>
    body {
      margin: 0;
      background: #0e1420;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    .device {
      width: 440px;
      height: 844px;
      background: #0e1420;
      border-radius: 40px;
      border: 8px solid #1f2937;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    }

    /* ── Sidebar Drawer Overlay & Menu (Image 2 Redesign) ── */
    .sidebar-overlay {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(5, 12, 26, 0.72);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      z-index: 1000;
      opacity: 1;
      pointer-events: auto;
      transition: opacity 0.28s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .sidebar-drawer {
      position: absolute;
      top: 0;
      left: 0;
      bottom: 0;
      width: 320px;
      max-width: 82%;
      background: linear-gradient(180deg, #0036A8 0%, #001F6B 180px, #001138 320px, #000D28 100%);
      border-top-right-radius: 28px;
      border-bottom-right-radius: 28px;
      padding: 24px 16px 28px 16px;
      display: flex;
      flex-direction: column;
      box-shadow: 14px 0 36px rgba(0, 0, 0, 0.55);
      transform: translateX(0);
      transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
      overflow-y: auto;
      overflow-x: hidden;
      -ms-overflow-style: none;
      scrollbar-width: none;
      box-sizing: border-box;
      position: relative;
    }

    .sidebar-drawer::-webkit-scrollbar {
      display: none;
    }

    /* Ambient background wave graphics */
    .sidebar-bg-waves {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 280px;
      pointer-events: none;
      z-index: 0;
      opacity: 0.85;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 14px;
      position: relative;
      z-index: 2;
    }

    .sidebar-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .sidebar-logo {
      width: 24px;
      height: 24px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .sidebar-title {
      font-size: 17px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.2px;
    }

    .sidebar-close-btn {
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 8px;
      transition: background 0.15s ease;
    }

    .sidebar-close-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .sidebar-close-btn svg line {
      stroke: #FFFFFF;
    }

    /* Profile Card (Translucent Glassmorphism matching Image 2) */
    .sidebar-profile-card {
      background: linear-gradient(135deg, rgba(18, 80, 210, 0.45) 0%, rgba(6, 38, 125, 0.55) 100%);
      border: 1px solid rgba(80, 150, 255, 0.35);
      border-radius: 20px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(0, 20, 80, 0.35), inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      position: relative;
      z-index: 2;
      box-sizing: border-box;
    }

    .sidebar-profile-top {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .sidebar-avatar-circle {
      width: 50px;
      height: 50px;
      min-width: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, #1E78FF 0%, #0056D2 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      font-size: 18px;
      font-weight: 800;
      box-shadow: 0 4px 14px rgba(0, 86, 210, 0.45);
    }

    .sidebar-profile-info {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .sidebar-profile-name {
      font-size: 17.5px;
      font-weight: 700;
      color: #FFFFFF;
      letter-spacing: -0.2px;
      line-height: 1.2;
    }

    .sidebar-role-badge {
      background: #1D4ED8;
      color: #FFFFFF;
      font-size: 10.5px;
      font-weight: 800;
      padding: 3px 10px;
      border-radius: 6px;
      letter-spacing: 0.5px;
      align-self: flex-start;
      margin-top: 3px;
    }

    .sidebar-logout-btn {
      width: 100%;
      margin-top: 14px;
      background: rgba(220, 38, 38, 0.12);
      border: 1.2px solid rgba(239, 68, 68, 0.55);
      border-radius: 12px;
      padding: 9px 12px;
      color: #F87171;
      font-size: 13.5px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
      transition: background 0.15s ease, border-color 0.15s ease;
      box-sizing: border-box;
    }

    .sidebar-logout-btn:hover {
      background: rgba(220, 38, 38, 0.22);
      border-color: rgba(239, 68, 68, 0.75);
    }

    .sidebar-logout-btn:active {
      transform: scale(0.98);
    }

    /* Navigation List */
    .sidebar-nav {
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      z-index: 2;
    }

    .sidebar-nav-item {
      width: 100%;
      background: transparent;
      border: none;
      border-radius: 14px;
      padding: 8px 12px 8px 10px;
      color: #FFFFFF;
      text-align: left;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
      user-select: none;
      box-sizing: border-box;
      gap: 12px;
    }

    .sidebar-nav-item:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .sidebar-nav-item:active {
      transform: scale(0.99);
    }

    /* Icon Box on Left */
    .sidebar-item-icon-box {
      width: 38px;
      height: 38px;
      min-width: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      color: #FFFFFF;
      transition: all 0.15s ease;
      flex-shrink: 0;
    }

    .sidebar-item-label {
      flex: 1;
      font-size: 14.5px;
      font-weight: 600;
      color: #FFFFFF;
      letter-spacing: -0.1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sidebar-item-chevron {
      color: rgba(147, 197, 253, 0.65);
      flex-shrink: 0;
      transition: transform 0.15s ease, color 0.15s ease;
    }

    .sidebar-nav-item:hover .sidebar-item-chevron {
      color: #FFFFFF;
      transform: translateX(2px);
    }

    /* Active Item matching Image 2 ("Employee Dashboard" in reference) */
    .sidebar-nav-item.active {
      background: #DCE9FE !important;
    }

    .sidebar-nav-item.active .sidebar-item-icon-box {
      background: #0066FF !important;
      color: #FFFFFF !important;
      box-shadow: 0 3px 10px rgba(0, 102, 255, 0.35);
    }

    .sidebar-nav-item.active .sidebar-item-label {
      color: #0A2540 !important;
      font-weight: 700 !important;
    }

    .sidebar-nav-item.active .sidebar-item-chevron {
      color: #2563EB !important;
      stroke-width: 2.6 !important;
    }
  </style>
</head>
<body>
  <div class="device">
    <div class="sidebar-overlay open">
      <div class="sidebar-drawer">
        <!-- Luminous Wave Graphic in Header Background -->
        <svg class="sidebar-bg-waves" viewBox="0 0 320 280" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <radialGradient id="sbGlow" cx="20%" cy="20%" r="60%">
              <stop offset="0%" stop-color="#0066FF" stop-opacity="0.55"/>
              <stop offset="50%" stop-color="#0050D8" stop-opacity="0.3"/>
              <stop offset="100%" stop-color="#001F6B" stop-opacity="0"/>
            </radialGradient>
            <linearGradient id="sbWave1" x1="0%" y1="0%" x2="100%" y2="100%">
              <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4"/>
              <stop offset="60%" stop-color="#1D4ED8" stop-opacity="0.2"/>
              <stop offset="100%" stop-color="#00184A" stop-opacity="0"/>
            </linearGradient>
            <linearGradient id="sbWave2" x1="100%" y1="0%" x2="0%" y2="100%">
              <stop offset="0%" stop-color="#60A5FA" stop-opacity="0.35"/>
              <stop offset="100%" stop-color="#002277" stop-opacity="0"/>
            </linearGradient>
          </defs>
          <rect width="320" height="280" fill="url(#sbGlow)"/>
          <path d="M-20 70 Q 100 20 220 100 T 340 60 V0 H-20 Z" fill="url(#sbWave1)"/>
          <path d="M340 180 Q 200 120 120 210 T -20 190 V0 H340 Z" fill="url(#sbWave2)"/>
          <path d="M-20 140 C 60 120 140 170 240 130 C 280 110 310 130 340 145 V280 H-20 Z" fill="#001A52" fill-opacity="0.35"/>
        </svg>

        <!-- Header -->
        <div class="sidebar-header">
          <div class="sidebar-brand">
            <svg class="sidebar-logo" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M4 6H24V10H16V24H12V10H4V6Z" fill="#FFFFFF"/>
              <path d="M4 6L14 16L11 19L4 12V6Z" fill="#60A5FA" fill-opacity="0.8"/>
            </svg>
            <span class="sidebar-title">Mobile Application</span>
          </div>
          <button class="sidebar-close-btn" aria-label="Close">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <line x1="18" y1="6" x2="6" y2="18"></line>
              <line x1="6" y1="6" x2="18" y2="18"></line>
            </svg>
          </button>
        </div>

        <!-- Profile Card -->
        <div class="sidebar-profile-card">
          <div class="sidebar-profile-top">
            <div class="sidebar-avatar-circle">
              <span>JD</span>
            </div>
            <div class="sidebar-profile-info">
              <div class="sidebar-profile-name">John Doe</div>
              <span class="sidebar-role-badge">EMPLOYEE</span>
            </div>
          </div>
          <button class="sidebar-logout-btn">
            <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#F87171" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            <span>Log Out</span>
          </button>
        </div>

        <!-- Navigation Links Matching Image 2 Reference -->
        <nav class="sidebar-nav">
          <!-- 1. Employee Dashboard (Active in Image 2) -->
          <button class="sidebar-nav-item active">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                <polyline points="9 22 9 12 15 12 15 22"></polyline>
              </svg>
            </div>
            <span class="sidebar-item-label">Employee Dashboard</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 2. My Attendance -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            <span class="sidebar-item-label">My Attendance</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 3. Apply Leave -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <line x1="16" y1="17" x2="8" y2="17"></line>
              </svg>
            </div>
            <span class="sidebar-item-label">Apply Leave</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 4. Apply Permission -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h6"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="16" y1="13" x2="8" y2="13"></line>
                <circle cx="18" cy="18" r="4"></circle>
                <polyline points="18 16 18 18 19.5 19.5"></polyline>
              </svg>
            </div>
            <span class="sidebar-item-label">Apply Permission</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 5. Leave Balance -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="18" y1="20" x2="18" y2="10"></line>
                <line x1="12" y1="20" x2="12" y2="4"></line>
                <line x1="6" y1="20" x2="6" y2="14"></line>
              </svg>
            </div>
            <span class="sidebar-item-label">Leave Balance</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 6. My Requests (History) -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
                <polyline points="12 7 12 12 15 15"></polyline>
              </svg>
            </div>
            <span class="sidebar-item-label">My Requests (History)</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 7. Holiday Calendar -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
                <circle cx="8" cy="14" r="1" fill="currentColor"></circle>
                <circle cx="12" cy="14" r="1" fill="currentColor"></circle>
                <circle cx="16" cy="14" r="1" fill="currentColor"></circle>
                <circle cx="8" cy="18" r="1" fill="currentColor"></circle>
                <circle cx="12" cy="18" r="1" fill="currentColor"></circle>
              </svg>
            </div>
            <span class="sidebar-item-label">Holiday Calendar</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 8. Notifications -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
              </svg>
            </div>
            <span class="sidebar-item-label">Notifications</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>

          <!-- 9. My Profile -->
          <button class="sidebar-nav-item">
            <div class="sidebar-item-icon-box">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                <circle cx="12" cy="7" r="4"></circle>
              </svg>
            </div>
            <span class="sidebar-item-label">My Profile</span>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
              <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
          </button>
        </nav>
      </div>
    </div>
  </div>
</body>
</html>
