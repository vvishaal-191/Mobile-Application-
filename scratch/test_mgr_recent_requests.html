<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Test Manager Dashboard Recent Requests & Status</title>
  <style>
    body { font-family: -apple-system, sans-serif; background: #F8FAFC; padding: 20px; }
    
    /* Employee Status Pill */
    .profile-status-pill {
      padding: 5px 12px;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 700;
      transition: all 0.25s ease;
    }
    .profile-status-pill.active-status {
      background: #DCFCE7 !important;
      border: 1px solid #86EFAC !important;
      color: #15803D !important;
    }
    .profile-status-pill.active-status .profile-status-dot {
      background: #16A34A !important;
    }
    .profile-status-pill.inactive-status {
      background: #FEE2E2 !important;
      border: 1px solid #FCA5A5 !important;
      color: #DC2626 !important;
    }
    .profile-status-pill.inactive-status .profile-status-dot {
      background: #EF4444 !important;
    }
    .profile-status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      display: inline-block;
    }

    /* Recent Requests Card */
    .recent-req-item {
      background: #FFFFFF;
      border: 1px solid #E2E8F0;
      border-radius: 14px;
      padding: 14px 16px;
      margin-bottom: 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      cursor: pointer;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
      transition: transform 0.15s, box-shadow 0.15s, border-color 0.15s;
    }
    .recent-req-item:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.08);
      border-color: #BFDBFE;
    }
    .recent-req-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .recent-req-user {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .recent-req-avatar {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: #2563EB;
      color: #FFFFFF;
      font-weight: 700;
      font-size: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .recent-req-name {
      font-size: 14px;
      font-weight: 700;
      color: #0F172A;
    }
    .recent-req-role {
      font-size: 11.5px;
      color: #64748B;
    }
    .recent-req-middle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 12px;
    }
    .req-type-pill {
      background: #EFF6FF;
      color: #2563EB;
      border: 1px solid #DBEAFE;
      padding: 2px 8px;
      border-radius: 6px;
      font-weight: 600;
    }
    .req-date-text {
      color: #475569;
      font-weight: 500;
    }
    .recent-req-reason {
      font-size: 12px;
      color: #64748B;
      background: #F8FAFC;
      padding: 6px 10px;
      border-radius: 8px;
      line-height: 1.4;
    }
  </style>
</head>
<body>
  <h3>Active Status Preview:</h3>
  <div class="profile-status-pill active-status">
    <span class="profile-status-dot"></span>
    <span class="profile-status-text">Active</span>
  </div>

  <h3 style="margin-top:20px;">Inactive Status Preview (All Red):</h3>
  <div class="profile-status-pill inactive-status">
    <span class="profile-status-dot"></span>
    <span class="profile-status-text">Inactive</span>
  </div>

  <h3 style="margin-top:30px;">Recent Request Card Preview:</h3>
  <div class="recent-req-item">
    <div class="recent-req-top">
      <div class="recent-req-user">
        <div class="recent-req-avatar">PS</div>
        <div>
          <div class="recent-req-name">Priya Sharma</div>
          <div class="recent-req-role">Senior Software Engineer</div>
        </div>
      </div>
      <div class="profile-status-pill active-status">
        <span class="profile-status-dot"></span>
        <span class="profile-status-text">Active</span>
      </div>
    </div>
    <div class="recent-req-middle">
      <span class="req-type-pill">Casual Leave (2 Days)</span>
      <span class="req-date-text">Sep 10, 2026 – Sep 11, 2026</span>
    </div>
    <div class="recent-req-reason">
      "Family function - attending sister's wedding ceremony in Bangalore."
    </div>
  </div>
</body>
</html>
