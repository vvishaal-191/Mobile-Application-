<template id="tpl-EmployeeDashboard">
    <!DOCTYPE html>
    <html>

    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <style>
        :root {
          --primary: #2F6BFF;
          --primary-dark: #1D4ED8;
          --bg: #F4F7FB;
          --surface: #FFFFFF;
          --navy: #1B2333;
          --text: #0F172A;
          --text-secondary: #64748B;
          --text-muted: #94A3B8;
          --success: #1FAE6E;
          --success-bg: #E3F8EE;
          --danger: #E5484D;
          --danger-bg: #FCE4E4;
          --warning: #F5A623;
          --warning-bg: #FDF0DA;
          --purple: #8B5CF6;
          --purple-bg: #EFE9FE;
          --info: #2F6BFF;
          --info-bg: #E7EEFF;
          --border: #E7EAF0;
          --chip: #EEF2FF;
        }

        * {
          box-sizing: border-box;
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
          margin: 0;
          padding: 0;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        *::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        .device::-webkit-scrollbar,
        .screen::-webkit-scrollbar,
        div::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
          background: transparent !important;
        }

        html, body, .device, .screen,
        .screen.has-dash-header {

          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        body {
          margin: 0;
          background: var(--bg);
          display: flex;
          justify-content: center;
          align-items: stretch;
          padding: 0;
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
        }

        .device {
          width: 100%;
          max-width: 440px;
          height: 100vh;
          height: 100dvh;
          background: var(--bg);
          border-radius: 0;
          border: none;
          overflow: hidden;
          position: relative;
          box-shadow: none;
          display: flex;
          flex-direction: column;
          margin: 0 auto;
        }

        @media (min-width: 769px) {
          body {
            background: #0e1420;
            padding: 15px 0;
            align-items: center;
          }

          .device {
            border-radius: 40px;
            border: 8px solid #1f2937;
            height: 844px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .4);
          }
        }

        .screen {
          flex: 1;
          overflow-y: auto;
          padding-top: 0 !important;
          padding-bottom: 96px;
          -webkit-overflow-scrolling: touch;
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        .screen::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
        }

        /* ── Header Aligned Upward ── */
        .dash-header {
          margin-top: 0 !important;
          border-top-left-radius: 0 !important;
          border-top-right-radius: 0 !important;
          margin-top: 0 !important;
          background: linear-gradient(135deg, #0937A0 0%, #0A4FD5 45%, #1862EE 78%, #2B76FB 100%);
          position: relative;
          border-radius: 0 0 28px 28px;
          padding: 24px 18px 22px 18px;
          color: #FFFFFF;
          overflow: hidden;
          box-shadow: 0 4px 20px rgba(10, 79, 213, 0.18);
        }

        .dash-header::before {
          content: '';
          position: absolute;
          top: -40px;
          right: -40px;
          width: 320px;
          height: 320px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.03) 60%, transparent 80%);
          pointer-events: none;
        }

        .dash-header::after {
          content: '';
          position: absolute;
          bottom: -60px;
          left: -20px;
          width: 260px;
          height: 180px;
          border-radius: 50%;
          background: radial-gradient(circle, rgba(255, 255, 255, 0.08) 0%, transparent 70%);
          pointer-events: none;
        }

        .header-top {
          display: flex;
          align-items: center;
          justify-content: space-between;
          position: relative;
          z-index: 2;
        }

        .header-left-brand {
          display: flex;
          align-items: center;
          gap: 12px;
          height: 40px;
        }

        .hamburger-btn {
          background: transparent;
          border: none;
          cursor: pointer;
          display: flex;
          align-items: center;
          justify-content: center;
          padding: 0;
          width: 38px;
          height: 38px;
          border-radius: 10px;
          flex-shrink: 0;
          transition: background 0.15s ease;
        }
        .hamburger-btn:hover {
          background: rgba(255, 255, 255, 0.12);
        }

        .header-dashboard-title-wrap {
          position: relative;
          display: inline-flex;
          align-items: center;
        }

        .header-dashboard-title {
          font-size: 24px;
          font-weight: 700;
          color: #FFFFFF;
          line-height: 1.2;
          letter-spacing: -0.3px;
        }

        .header-bell-wrap {
          position: relative;
          width: 38px;
          height: 38px;
          border-radius: 19px;
          background: #0B2568;
          display: flex;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          transition: transform 0.2s ease;
        }

        .header-bell-wrap:hover {
          transform: scale(1.05);
        }

        .header-bell-dot {
          position: absolute;
          top: 3px;
          right: 4px;
          width: 8px;
          height: 8px;
          border-radius: 4px;
          background: #EF4444;
          border: 1.5px solid #0B2568;
        }

        @keyframes bellPulseGlow {
          0%, 100% {
            box-shadow: 0 0 0 0 rgba(77, 150, 255, 0.5), 0 0 12px rgba(47, 107, 255, 0.6);
          }
          50% {
            box-shadow: 0 0 0 6px rgba(77, 150, 255, 0.15), 0 0 20px rgba(47, 107, 255, 0.9);
          }
        }

        .header-bell-wrap.has-glow {
          animation: bellPulseGlow 2s infinite ease-in-out;
        }

        /* Header Profile / Greeting Block */
        .header-profile-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          margin-top: 20px;
          position: relative;
          z-index: 2;
        }

        .profile-greeting-col {
          display: flex;
          flex-direction: column;
        }

        .profile-hello {
          font-size: 14px;
          color: rgba(255, 255, 255, 0.9);
          font-weight: 400;
          line-height: 1.2;
        }

        .profile-name-title {
          font-size: 24px;
          font-weight: 800;
          color: #FFFFFF;
          line-height: 1.25;
          margin: 2px 0 3px;
          letter-spacing: -0.3px;
        }

        .profile-meta-role {
          font-size: 12.5px;
          color: rgba(255, 255, 255, 0.85);
          font-weight: 500;
          margin-bottom: 8px;
        }

        .profile-date-badge {
          display: inline-flex;
          align-items: center;
          gap: 6px;
          font-size: 12.5px;
          color: rgba(255, 255, 255, 0.9);
          font-weight: 500;
        }

        .profile-avatar-block {
          display: flex;
          flex-direction: column;
          align-items: center;
          flex-shrink: 0;
          cursor: pointer;
          user-select: none;
          transition: transform 0.15s ease, opacity 0.15s ease;
        }

        .profile-avatar-block:hover {
          opacity: 0.92;
          transform: translateY(-1px);
        }

        .profile-avatar-block:active {
          transform: scale(0.97);
        }

        .avatar-circle-wrap {
          width: 74px;
          height: 74px;
          border-radius: 50%;
          background: #EBF3FE;
          border: 3.5px solid #FFFFFF;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 14px rgba(0, 0, 0, 0.15);
          overflow: hidden;
        }

        .avatar-caption {
          font-size: 11px;
          color: rgba(255, 255, 255, 0.92);
          font-weight: 500;
          margin-top: 6px;
          text-align: center;
        }

        .avatar-line-accent {
          width: 22px;
          height: 2px;
          background: #93C5FD;
          border-radius: 1px;
          margin-top: 3px;
        }

        /* ── 4 Action Cards (2x2 Grid) - Perfectly Aligned Top Edges & Uniform Heights ── */
        .dash-action-grid {
          display: grid;
          grid-template-columns: 1fr 1fr;
          gap: 12px;
          margin: 14px 16px 14px 16px;
          padding: 0;
          align-items: stretch;
        }

        .dash-action-card {
          background: #FFFFFF;
          border: 1px solid #EAEFF5;
          border-radius: 18px;
          padding: 14px 13px 13px 13px;
          height: 126px;
          min-height: 126px;
          box-sizing: border-box;
          display: flex;
          flex-direction: column;
          justify-content: space-between;
          position: relative;
          overflow: hidden;
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.025);
          cursor: pointer;
          transition: transform 0.2s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.2s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.2s ease;
          user-select: none;
        }

        .dash-action-card:hover {
          transform: translateY(-2px);
          border-color: #D3E0FF;
          box-shadow: 0 8px 24px rgba(47, 107, 255, 0.1), 0 2px 6px rgba(47, 107, 255, 0.04);
        }

        .dash-action-card.card-leave {
          background-image: radial-gradient(circle at 100% 100%, #D4E5FC 0%, #D4E5FC 28%, rgba(212, 229, 252, 0.5) 45%, transparent 68%);
        }

        .dash-action-card.card-perm {
          background-image: radial-gradient(circle at 100% 100%, #D2F6FA 0%, #D2F6FA 28%, rgba(210, 246, 250, 0.5) 45%, transparent 68%);
        }

        .dash-action-card.card-reqs {
          background-image: radial-gradient(circle at 100% 100%, #ECE6FE 0%, #ECE6FE 28%, rgba(236, 230, 254, 0.5) 45%, transparent 68%);
        }

        .dash-action-card.card-holiday {
          background-image: radial-gradient(circle at 100% 100%, #FEEBD7 0%, #FEEBD7 28%, rgba(254, 235, 215, 0.5) 45%, transparent 68%);
        }

        .action-top-row {
          display: flex;
          align-items: center;
          justify-content: space-between;
          height: 40px;
        }

        .action-icon-box {
          width: 40px;
          height: 40px;
          border-radius: 12px;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 4px 10px rgba(0, 0, 0, 0.08);
        }

        .action-chevron-btn {
          width: 26px;
          height: 26px;
          border-radius: 13px;
          display: flex;
          align-items: center;
          justify-content: center;
          transition: transform 0.2s ease;
        }

        .dash-action-card:hover .action-chevron-btn {
          transform: translateX(2px);
        }

        .action-text-col {
          display: flex;
          flex-direction: column;
          justify-content: flex-end;
          margin-top: 8px;
        }

        .action-main-title {
          font-size: 15px;
          font-weight: 800;
          color: #0F172A;
          letter-spacing: -0.2px;
          line-height: 1.25;
        }

        .action-sub-text {
          font-size: 11px;
          color: #64748B;
          margin-top: 3px;
          line-height: 1.2;
          font-weight: 500;
        }

        /* ── Leave Balances Card ── */
        .leave-balances-card {
          background: #FFFFFF;
          border: 1px solid #EAEFF5;
          border-radius: 18px;
          padding: 16px 16px 14px 16px;
          margin: 0 16px 14px 16px;
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.025);
        }

        .balances-card-header {
          display: flex;
          align-items: center;
          gap: 8px;
          margin-bottom: 14px;
        }

        .balances-card-title {
          font-size: 15.5px;
          font-weight: 800;
          color: #0F172A;
          letter-spacing: -0.2px;
        }

        .balance-item-row {
          display: flex;
          align-items: center;
          gap: 12px;
          margin-bottom: 13px;
        }

        .balance-item-row:last-child {
          margin-bottom: 0;
        }

        .balance-icon-circle {
          width: 38px;
          height: 38px;
          border-radius: 19px;
          display: flex;
          align-items: center;
          justify-content: center;
          flex-shrink: 0;
        }

        .balance-content-col {
          flex: 1;
          display: flex;
          flex-direction: column;
        }

        .balance-title-row {
          display: flex;
          justify-content: space-between;
          align-items: baseline;
        }

        .balance-item-label {
          font-size: 13px;
          font-weight: 700;
          color: #0F172A;
        }

        .balance-item-val {
          font-size: 12px;
          font-weight: 700;
          color: #2563EB;
        }

        .balance-sub-label {
          font-size: 10.5px;
          color: #64748B;
          margin: 1px 0 6px;
        }

        .balance-progress-track {
          width: 100%;
          height: 7px;
          background: #E2E8F0;
          border-radius: 4px;
          overflow: hidden;
        }

        .balance-progress-fill {
          height: 100%;
          background: #1D4ED8;
          border-radius: 4px;
        }

        /* ── Recent Requests Card (Image 4 - Displayed ONLY on Manager Approval/Rejection) ── */
        .recent-requests-section {
          margin: 0 16px 14px 16px;
          display: none; /* Hidden by default */
        }

        .recent-requests-header {
          font-size: 11.5px;
          font-weight: 700;
          color: #94A3B8;
          text-transform: uppercase;
          letter-spacing: 0.5px;
          margin: 0 4px 8px;
        }

        .recent-request-card {
          background: #FFFFFF;
          border: 1px solid #EAEFF5;
          border-radius: 18px;
          padding: 14px 16px;
          display: flex;
          align-items: center;
          justify-content: space-between;
          box-shadow: 0 4px 16px rgba(0, 0, 0, 0.025);
          cursor: pointer;
          transition: transform 0.2s ease, box-shadow 0.2s ease, border-color 0.2s ease;
        }

        .recent-request-card:hover {
          transform: translateY(-2px);
          border-color: #D3E0FF;
          box-shadow: 0 6px 20px rgba(47, 107, 255, 0.08);
        }

        .recent-request-left {
          display: flex;
          flex-direction: column;
          gap: 3px;
          flex: 1;
          min-width: 0;
        }

        .recent-request-title {
          font-size: 14.5px;
          font-weight: 800;
          color: #0F172A;
          letter-spacing: -0.2px;
          line-height: 1.25;
        }

        .recent-request-sub {
          font-size: 12px;
          color: #64748B;
          font-weight: 500;
          line-height: 1.25;
        }

        .recent-request-meta {
          font-size: 11px;
          color: #64748B;
          font-weight: 500;
          line-height: 1.25;
          margin-top: 1px;
        }

        .recent-request-right {
          display: flex;
          align-items: center;
          gap: 8px;
          flex-shrink: 0;
          margin-left: 12px;
        }

        .recent-request-badge {
          background: #DCFCE7;
          color: #16A34A;
          font-size: 11.5px;
          font-weight: 700;
          padding: 5px 12px;
          border-radius: 20px;
          display: inline-flex;
          align-items: center;
          justify-content: center;
        }

        .recent-request-dismiss-btn {
          background: transparent;
          border: none;
          cursor: pointer;
          padding: 2px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 50%;
          transition: opacity 0.15s ease, transform 0.15s ease;
        }

        .recent-request-dismiss-btn:hover {
          opacity: 0.75;
          transform: scale(1.1);
        }

        /* ── Sidebar Drawer Overlay & Menu (Image 2 Redesign) ── */
        /* ── Sidebar Overlay & Drawer matching Image 2 Reference ── */
        .sidebar-overlay {
          position: absolute;
          top: 0;
          left: 0;
          right: 0;
          bottom: 0;
          background: rgba(0, 8, 24, 0.6);
          backdrop-filter: blur(4px);
          -webkit-backdrop-filter: blur(4px);
          z-index: 9999;
          opacity: 0;
          pointer-events: none;
          transition: opacity 0.25s ease;
        }

        .sidebar-overlay.open {
          opacity: 1;
          pointer-events: auto;
        }

        .sidebar-drawer {
          position: absolute;
          top: 0;
          left: 0;
          bottom: 0;
          width: 320px;
          max-width: 84%;
          background: linear-gradient(180deg, #002888 0%, #001A5E 140px, #00103A 260px, #000924 100%);
          border-top-right-radius: 28px;
          border-bottom-right-radius: 28px;
          padding: 24px 16px 28px 16px;
          display: flex;
          flex-direction: column;
          box-shadow: 16px 0 40px rgba(0, 0, 0, 0.65);
          transform: translateX(-100%);
          transition: transform 0.28s cubic-bezier(0.4, 0, 0.2, 1);
          overflow-y: auto;
          overflow-x: hidden;
          -ms-overflow-style: none;
          scrollbar-width: none;
          box-sizing: border-box;
          position: relative;
        }

        .sidebar-drawer::-webkit-scrollbar {
          display: none;
        }

        .sidebar-overlay.open .sidebar-drawer {
          transform: translateX(0);
        }

        .sidebar-bg-waves {
          position: absolute;
          top: 0;
          left: 0;
          width: 100%;
          height: 310px;
          pointer-events: none;
          z-index: 0;
        }

        .sidebar-header {
          display: flex;
          align-items: center;
          justify-content: space-between;
          padding-top: 2px;
          padding-bottom: 16px;
          position: relative;
          z-index: 2;
        }

        .sidebar-brand {
          display: flex;
          align-items: center;
          gap: 11px;
        }

        .sidebar-logo {
          width: 26px;
          height: 26px;
          object-fit: contain;
          flex-shrink: 0;
          filter: drop-shadow(0 1px 3px rgba(0, 0, 0, 0.35));
        }

        .sidebar-title {
          font-size: 17px;
          font-weight: 700;
          color: #FFFFFF;
          letter-spacing: -0.2px;
          text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
        }

        .sidebar-close-btn {
          background: transparent;
          border: none;
          cursor: pointer;
          padding: 6px;
          display: flex;
          align-items: center;
          justify-content: center;
          border-radius: 8px;
          transition: background 0.15s ease;
        }

        .sidebar-close-btn:hover {
          background: rgba(255, 255, 255, 0.12);
        }

        .sidebar-close-btn svg line {
          stroke: #FFFFFF;
        }

        .sidebar-profile-card {
          background: linear-gradient(135deg, rgba(20, 85, 220, 0.42) 0%, rgba(8, 42, 135, 0.55) 100%);
          border: 1px solid rgba(120, 180, 255, 0.38);
          border-radius: 20px;
          padding: 16px 18px;
          margin-bottom: 22px;
          box-shadow: 0 8px 24px rgba(0, 15, 60, 0.4), inset 0 1px 1.5px rgba(255, 255, 255, 0.3);
          backdrop-filter: blur(14px);
          -webkit-backdrop-filter: blur(14px);
          position: relative;
          z-index: 2;
          box-sizing: border-box;
        }

        .sidebar-profile-top {
          display: flex;
          align-items: center;
          gap: 14px;
        }

        .sidebar-avatar-circle {
          width: 52px;
          height: 52px;
          min-width: 52px;
          border-radius: 50%;
          background: linear-gradient(135deg, #1E78FF 0%, #0056D2 100%);
          display: flex;
          align-items: center;
          justify-content: center;
          color: #FFFFFF;
          font-size: 19px;
          font-weight: 800;
          box-shadow: 0 4px 16px rgba(0, 86, 210, 0.5);
          border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .sidebar-profile-info {
          display: flex;
          flex-direction: column;
          gap: 3px;
        }

        .sidebar-profile-name {
          font-size: 18px;
          font-weight: 700;
          color: #FFFFFF;
          letter-spacing: -0.2px;
          line-height: 1.2;
        }

        .sidebar-role-badge {
          background: #1D4ED8;
          color: #FFFFFF;
          font-size: 10.5px;
          font-weight: 800;
          padding: 3px 10px;
          border-radius: 6px;
          letter-spacing: 0.6px;
          align-self: flex-start;
          margin-top: 3px;
          box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
        }

        .sidebar-logout-btn {
          width: 100%;
          margin-top: 14px;
          background: rgba(220, 38, 38, 0.12);
          border: 1.2px solid rgba(239, 68, 68, 0.55);
          border-radius: 12px;
          padding: 9px 12px;
          color: #F87171;
          font-size: 13.5px;
          font-weight: 700;
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 8px;
          cursor: pointer;
          transition: background 0.15s ease, border-color 0.15s ease;
          box-sizing: border-box;
        }

        .sidebar-logout-btn:hover {
          background: rgba(220, 38, 38, 0.22);
          border-color: rgba(239, 68, 68, 0.75);
        }

        .sidebar-logout-btn:active {
          transform: scale(0.98);
        }

        .sidebar-nav {
          display: flex;
          flex-direction: column;
          gap: 6px;
          position: relative;
          z-index: 2;
        }

        .sidebar-nav-item {
          width: 100%;
          background: transparent;
          border: none;
          border-radius: 14px;
          padding: 8px 12px 8px 10px;
          color: #FFFFFF;
          text-align: left;
          cursor: pointer;
          display: flex;
          align-items: center;
          transition: all 0.15s ease;
          user-select: none;
          box-sizing: border-box;
          gap: 12px;
        }

        .sidebar-nav-item:hover {
          background: rgba(255, 255, 255, 0.07);
        }

        .sidebar-nav-item:active {
          transform: scale(0.99);
        }

        .sidebar-item-icon-box {
          width: 38px;
          height: 38px;
          min-width: 38px;
          border-radius: 10px;
          background: rgba(255, 255, 255, 0.08);
          display: flex;
          align-items: center;
          justify-content: center;
          color: #FFFFFF;
          transition: all 0.15s ease;
          flex-shrink: 0;
        }

        .sidebar-item-label {
          flex: 1;
          font-size: 14.5px;
          font-weight: 600;
          color: #FFFFFF;
          letter-spacing: -0.1px;
          white-space: nowrap;
          overflow: hidden;
          text-overflow: ellipsis;

                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="sidebar-item-chevron">
                  <polyline points="9 18 15 12 9 6"></polyline>
                </svg>
              </button>
            </nav>
          </div>
        </div>
      </div>

      <script>
        function openSidebarDrawer() {
          var overlay = document.getElementById('sidebar-overlay');
          if (overlay) overlay.classList.add('open');
          var pWin = (window.parent && window.parent !== window) ? window.parent : window;
          var prof = pWin.USER_PROFILE || window.USER_PROFILE || {};
          var nameEl = document.getElementById('sidebar-name');
          var initialsEl = document.getElementById('sidebar-initials');
          var curName = prof.name || (window.AUTH_USER && window.AUTH_USER.name) || 'Sneha Reddy';
          if (nameEl) nameEl.textContent = curName;
          if (initialsEl) {
            var parts = curName.trim().split(/\s+/);
            initialsEl.textContent = parts.length > 1 ? (parts[0][0] + parts[1][0]).toUpperCase() : curName.slice(0, 2).toUpperCase();
          }
        }

        function closeSidebarDrawer() {
          var overlay = document.getElementById('sidebar-overlay');
          if (overlay) overlay.classList.remove('open');
        }

        function handleSidebarNav(screenId) {
          closeSidebarDrawer();
          if (screenId === 'tpl-Profile' || screenId === 'Profile') {
            screenId = 'tpl-MyProfile';
          }
          setTimeout(function() {
            var pWin = (window.parent && window.parent !== window) ? window.parent : window;
            if (pWin.loadScreen) {
              pWin.loadScreen(screenId);
            } else if (typeof loadScreen === 'function') {
              loadScreen(screenId);
            }
          }, 120);
        }

        function handleSidebarLogout() {
          closeSidebarDrawer();
          setTimeout(function() {
            var pWin = (window.parent && window.parent !== window) ? window.parent : window;
            if (pWin.logout) {
              pWin.logout();
            } else if (typeof logout === 'function') {
              logout();
            } else if (pWin.loadScreen) {
              pWin.loadScreen('tpl-Login');
            } else if (typeof loadScreen === 'function') {
              loadScreen('tpl-Login');
            }
          }, 100);
        }

        function dismissRecentRequest(cardId, e) {
          if (e && e.stopPropagation) e.stopPropagation();
          var card = cardId ? document.getElementById(cardId) : document.querySelector('.recent-request-card');
          if (card) {
            card.style.transition = 'all 0.25s ease';
            card.style.opacity = '0';
            card.style.transform = 'scale(0.95)';
            setTimeout(function() {
              card.remove();
              var reqList = document.getElementById('emp-dash-requests-list');
              var remainingCards = reqList ? reqList.querySelectorAll('.recent-request-card').length : 0;
              var label = document.getElementById('emp-dash-requests-label');
              var sec = document.getElementById('emp-recent-requests-section');
              if (label) label.textContent = 'RECENT REQUESTS (' + remainingCards + ')';
              if (remainingCards === 0 && sec) {
                sec.style.display = 'none';
              }
            }, 250);
          }
        }

        function syncDashboardRequests() {
          var pWin = (window.parent && window.parent !== window) ? window.parent : window;
          var docRef = document;
          setTimeout(function() {
            var sec = docRef.getElementById('emp-recent-requests-section');
            var reqList = docRef.getElementById('emp-dash-requests-list');
            var label = docRef.getElementById('emp-dash-requests-label');
            if (!sec || !reqList) return;

            var allReqs = [];
            try {
              if (pWin.EMP_LEAVE_REQUESTS && pWin.EMP_LEAVE_REQUESTS.length > 0) {
                allReqs = pWin.EMP_LEAVE_REQUESTS.slice();
              } else if (window.EMP_LEAVE_REQUESTS && window.EMP_LEAVE_REQUESTS.length > 0) {
                allReqs = window.EMP_LEAVE_REQUESTS.slice();
              } else if (pWin.ALL_SUBMITTED_REQUESTS && pWin.ALL_SUBMITTED_REQUESTS.length > 0) {
                allReqs = pWin.ALL_SUBMITTED_REQUESTS.slice();
              } else if (window.ALL_SUBMITTED_REQUESTS && window.ALL_SUBMITTED_REQUESTS.length > 0) {
                allReqs = window.ALL_SUBMITTED_REQUESTS.slice();
              } else {
                var stored = sessionStorage.getItem('ALL_SUBMITTED_REQUESTS') || (pWin.sessionStorage && pWin.sessionStorage.getItem('ALL_SUBMITTED_REQUESTS'));
                if (stored) allReqs = JSON.parse(stored);
              }
            } catch (e) {}

            var lastDecision = pWin.LAST_LEAVE_DECISION || window.LAST_LEAVE_DECISION || pWin.lastLeaveDecision || window.lastLeaveDecision;
            if (lastDecision && (lastDecision.status === 'approved' || lastDecision.status === 'rejected')) {
              var alreadyIn = allReqs.some(function(r) { return String(r.id) === String(lastDecision.id); });
              if (!alreadyIn) {
                allReqs.unshift({
                  id: lastDecision.id || ('dec-' + Date.now()),
                  leaveType: lastDecision.lType || 'Casual Leave',
                  title: (lastDecision.lType || 'Casual Leave') + ' (1.0 Day)',
                  subtitle: (lastDecision.fromDate || '07-Sep-2026') + ' • Personal Work',
                  fromDate: lastDecision.fromDate || '07-Sep-2026',
                  reason: 'Personal Work',
                  status: lastDecision.status,
                  employeeName: lastDecision.empName || (pWin.USER_PROFILE && pWin.USER_PROFILE.name) || 'Sneha Reddy',
                  employeeId: 'EMP-2024-0103'
                });
              }
            }

            // Filter ONLY approved or rejected requests (Image 4 format)
            var approvedOrRejected = allReqs.filter(function(r) {
              if (pWin.DELETED_REQUEST_IDS && pWin.DELETED_REQUEST_IDS.indexOf(String(r.id)) !== -1) return false;
              if (window.DELETED_REQUEST_IDS && window.DELETED_REQUEST_IDS.indexOf(String(r.id)) !== -1) return false;
              var st = (r.status || '').toLowerCase();
              return st === 'approved' || st === 'rejected';
            });

            if (approvedOrRejected.length === 0) {
              sec.style.display = 'none';
              reqList.innerHTML = '';
              if (label) label.textContent = 'RECENT REQUESTS (0)';
              return;
            }

            // Display Recent Requests
            sec.style.display = 'block';
            if (label) label.textContent = 'RECENT REQUESTS (' + approvedOrRejected.length + ')';
            reqList.innerHTML = '';

            approvedOrRejected.forEach(function(req) {
              var isApp = (req.status || '').toLowerCase() === 'approved';
              var badgeBg = isApp ? '#DCFCE7' : '#FCE4E4';
              var badgeColor = isApp ? '#16A34A' : '#E5484D';
              var badgeText = isApp ? 'Approved' : 'Rejected';
              var title = req.title || ((req.leaveType || req.type || 'Casual Leave') + ' (' + (req.daysText || req.totalDays || req.duration || '1.0 Day') + ')');
              var sub = req.subtitle || ((req.fromDate || req.date || '07-Sep-2026') + ' • ' + (req.reason || 'Personal Work'));
              var meta = (req.employeeName || (pWin.USER_PROFILE && pWin.USER_PROFILE.name) || 'Sneha Reddy') + ' • ' + (req.employeeId || (pWin.USER_PROFILE && pWin.USER_PROFILE.employeeId) || 'EMP-2024-0103');
              var reqId = 'emp-recent-req-' + (req.id || Math.random().toString(36).substr(2, 6));

              var c = docRef.createElement('div');
              c.className = 'recent-request-card';
              c.id = reqId;
              c.style.marginTop = '8px';
              c.onclick = function() {
                if (pWin.loadScreen) pWin.loadScreen('tpl-LeaveHistory');
                else if (typeof loadScreen === 'function') loadScreen('tpl-LeaveHistory');
              };
              c.innerHTML = '<div class="recent-request-left">'
                + '<div class="recent-request-title">' + title + '</div>'
                + '<div class="recent-request-sub">' + sub + '</div>'
                + '<div class="recent-request-meta">' + meta + '</div>'
                + '</div>'
                + '<div class="recent-request-right">'
                + '<span class="recent-request-badge" style="background:' + badgeBg + ';color:' + badgeColor + ';">' + badgeText + '</span>'
                + '<button class="recent-request-dismiss-btn" aria-label="Dismiss">'
                + '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="10" stroke="#94A3B8" stroke-width="1.8" fill="none"/><line x1="15" y1="9" x2="9" y2="15" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/><line x1="9" y1="9" x2="15" y2="15" stroke="#94A3B8" stroke-width="1.8" stroke-linecap="round"/></svg>'
                + '</button>'
                + '</div>';
              var disBtn = c.querySelector('.recent-request-dismiss-btn');
              if (disBtn) {
                disBtn.onclick = function(e) {
                  if (e && e.stopPropagation) e.stopPropagation();
                  dismissRecentRequest(reqId, e);
                };
              }
              reqList.appendChild(c);
            });
          }, 150);
        }

        function openNotificationsFromDashboard() {
          var pWin = (window.parent && window.parent !== window) ? window.parent : window;
          pWin.HAS_NEW_NOTIFICATION = false;
          window.HAS_NEW_NOTIFICATION = false;
          try { sessionStorage.removeItem('HAS_NEW_NOTIFICATION'); } catch (e) {}
          try { pWin.sessionStorage.removeItem('HAS_NEW_NOTIFICATION'); } catch (e) {}
          var bell = document.getElementById('dash-bell-btn') || document.querySelector('.bell');
          if (bell) bell.classList.remove('has-glow');
          if (pWin.loadScreen) {
            pWin.loadScreen('tpl-Notifications');
          } else if (typeof loadScreen === 'function') {
            loadScreen('tpl-Notifications');
          }
        }

        function syncBellGlow() {
          var pWin = (window.parent && window.parent !== window) ? window.parent : window;
          var hasNew = false;
          try {
            hasNew = !!(pWin.HAS_NEW_NOTIFICATION || window.HAS_NEW_NOTIFICATION || sessionStorage.getItem('HAS_NEW_NOTIFICATION') === 'true' || pWin.sessionStorage.getItem('HAS_NEW_NOTIFICATION') === 'true');
          } catch (e) {
            hasNew = !!(pWin.HAS_NEW_NOTIFICATION || window.HAS_NEW_NOTIFICATION);
          }
          var bell = document.getElementById('dash-bell-btn') || document.querySelector('.bell');
          if (bell) {
            if (hasNew) {
              bell.classList.add('has-glow');
            } else {
              bell.classList.remove('has-glow');
            }
          }
        }
        syncBellGlow();
        syncDashboardRequests();
        document.addEventListener('DOMContentLoaded', function() {
          syncBellGlow();
          syncDashboardRequests();
        });
      </script>
    </body>
    </html>
  </template>
