<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
body { margin: 0; background: #0e1420; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: sans-serif; }
.device { width: 400px; height: 844px; background: #F8FAFC; border-radius: 40px; overflow: hidden; position: relative; }
.header-banner {
  position: relative;
  width: 100%;
  padding: 24px 20px 24px 20px;
  border-bottom-left-radius: 28px;
  border-bottom-right-radius: 28px;
  overflow: hidden;
  background: linear-gradient(135deg, #005CE6 0%, #0066FF 45%, #1877F2 100%);
  color: #FFFFFF;
  box-sizing: border-box;
}
.header-top-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  position: relative;
  z-index: 2;
}
.header-left {
  display: flex;
  align-items: center;
  gap: 12px;
}
.back-btn {
  width: 38px;
  height: 38px;
  border-radius: 19px;
  background: rgba(255, 255, 255, 0.22);
  border: 1px solid rgba(255, 255, 255, 0.35);
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.header-title { font-size: 20px; font-weight: 800; margin: 0; }
.header-subtitle { font-size: 13px; color: rgba(255, 255, 255, 0.85); margin: 3px 0 0 0; }
.cal-img { width: 85px; height: auto; display: block; }
</style>
</head>
<body>
<div class="device">
  <div class="header-banner">
    <div class="header-top-row">
      <div class="header-left">
        <div class="back-btn">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <line x1="19" y1="12" x2="5" y2="12"></line>
            <polyline points="12 19 5 12 12 5"></polyline>
          </svg>
        </div>
        <div>
          <h1 class="header-title">Leave Approvals</h1>
          <p class="header-subtitle">Manage Team Requests</p>
        </div>
      </div>
      <div>
        <img src="crop_cal.png" class="cal-img" alt="Calendar"/>
      </div>
    </div>
  </div>
</div>
</body>
</html>
