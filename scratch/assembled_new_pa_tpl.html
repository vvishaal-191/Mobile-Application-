  <template id="tpl-PermissionApprovals">
    <!DOCTYPE html>
    <html>

    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <style>
        :root {
          --primary: #0066FF;
          --primary-dark: #0052CC;
          --bg: #F8FAFC;
          --surface: #FFFFFF;
          --navy: #0F172A;
          --text: #0F172A;
          --text-secondary: #64748B;
          --text-muted: #94A3B8;
          --success: #10B981;
          --success-bg: #DCFCE7;
          --danger: #EF4444;
          --danger-bg: #FEE2E2;
          --warning: #F59E0B;
          --warning-bg: #FEF3C7;
          --purple: #8B5CF6;
          --purple-bg: #EFE9FE;
          --info: #0066FF;
          --info-bg: #DBEAFE;
          --border: #E2E8F0;
          --chip: #EFF6FF;
        }

        * {
          box-sizing: border-box;
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        *::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        .device::-webkit-scrollbar,
        .screen::-webkit-scrollbar,
        div::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
          background: transparent !important;
        }

        html, body, .device, .screen {
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        body {
          margin: 0;
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
          background: var(--bg);
          display: flex;
          justify-content: center;
          align-items: stretch;
          padding: 0;
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
        }

        .device {
          width: 100%;
          max-width: 440px;
          height: 100vh;
          height: 100dvh;
          background: var(--bg);
          border-radius: 0;
          border: none;
          overflow: hidden;
          position: relative;
          box-shadow: none;
          display: flex;
          flex-direction: column;
          margin: 0 auto;
        }

        @media (min-width: 769px) {
          body {
            background: #0e1420;
            padding: 15px 0;
            align-items: center;
          }

          .device {
            border-radius: 40px;
            border: 8px solid #1f2937;
            height: 844px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .4);
          }
        }

        .statusbar { display: none !important; }

        .screen {
          flex: 1;
          overflow-y: auto;
          padding-top: 0 !important;
          padding-bottom: 96px;
          background: var(--bg) !important;
          -webkit-overflow-scrolling: touch;
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        .screen::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
        }

        /* ===== HEADER BANNER MATCHING IMAGE 2 ===== */
        .pa-header-banner-wrap {
          position: relative;
          width: 100%;
          overflow: hidden;
          border-bottom-left-radius: 28px;
          border-bottom-right-radius: 28px;
          box-shadow: 0 10px 28px rgba(0, 102, 255, 0.22);
          background: #0066FF;
        }

        .header-banner-img {
          width: 100%;
          height: auto;
          display: block;
        }

        .back-btn-hitbox {
          position: absolute;
          left: 14px;
          top: 22px;
          width: 44px;
          height: 44px;
          border-radius: 50%;
          background: transparent;
          border: none;
          cursor: pointer;
          z-index: 10;
          -webkit-tap-highlight-color: transparent;
        }

        /* ===== SEGMENTED TAB BAR CARD MATCHING IMAGE 2 ===== */
        .tab-bar-card {
          display: flex;
          background: #FFFFFF;
          border-radius: 18px;
          margin: 14px 16px;
          padding: 5px;
          border: 1px solid #E2E8F0;
          box-shadow: 0 4px 14px rgba(15, 30, 80, 0.04);
          gap: 4px;
        }

        .tab-bar-card .tab-pill {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          padding: 8px 4px 6px;
          border-radius: 12px;
          cursor: pointer;
          user-select: none;
          background: transparent;
          border: none;
          transition: background 0.2s ease;
        }

        .tab-bar-card .tab-pill.active {
          background: #EFF6FF;
        }

        .tab-top-row {
          display: flex;
          align-items: center;
          justify-content: center;
          gap: 5px;
        }

        .tab-badge {
          width: 20px;
          height: 20px;
          border-radius: 10px;
          display: flex;
          align-items: center;
          justify-content: center;
        }

        .badge-pending {
          background: #DBEAFE;
        }

        .badge-approved {
          background: #DCFCE7;
        }

        .badge-rejected {
          background: #FEE2E2;
        }

        .tab-label {
          font-size: 12.5px;
          font-weight: 600;
          color: #475569;
          white-space: nowrap;
        }

        .tab-pill.active .tab-label {
          color: #0066FF;
          font-weight: 700;
        }

        .tab-indicator {
          height: 2.5px;
          width: 55%;
          border-radius: 2px;
          background: transparent;
          margin-top: 4px;
          transition: background 0.2s ease;
        }

        .tab-pill.active .tab-indicator {
          background: #0066FF;
        }

        /* ===== CONTENT AREA & EMPTY CARD MATCHING IMAGE 2 ===== */
        .approvals-card-container {
          margin: 0 16px;
        }

        .empty-card-wrapper {
          background: #FFFFFF;
          border-radius: 24px;
          border: 1px solid #E2E8F0;
          box-shadow: 0 4px 18px rgba(15, 30, 80, 0.04);
          min-height: 480px;
          position: relative;
          overflow: hidden;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: space-between;
          padding: 36px 20px 0;
          box-sizing: border-box;
        }

        .empty-state-content {
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          width: 100%;
        }

        .empty-art-wrap {
          width: 100%;
          max-width: 240px;
          margin: 0 auto 16px;
          display: flex;
          justify-content: center;
        }

        .empty-title {
          font-size: 19px;
          font-weight: 800;
          color: #0F172A;
          margin-bottom: 8px;
          text-align: center;
          letter-spacing: -0.2px;
        }

        .empty-subtitle {
          font-size: 13.5px;
          color: #64748B;
          text-align: center;
          line-height: 20px;
        }

        .empty-wave-decor {
          width: 100%;
          margin-top: auto;
          pointer-events: none;
          overflow: hidden;
        }

        /* ===== APPROVAL CARDS (WHEN REQUESTS EXIST) ===== */
        .approval-card {
          background: #FFFFFF;
          border-radius: 18px;
          border: 1px solid #E2E8F0;
          padding: 16px;
          margin-bottom: 14px;
          box-shadow: 0 3px 12px rgba(15, 30, 80, 0.03);
          cursor: pointer;
        }

        .top-row {
          display: flex;
          justify-content: space-between;
          align-items: flex-start;
        }

        .emp-row {
          display: flex;
          gap: 12px;
          align-items: center;
        }

        .avatar {
          width: 46px;
          height: 46px;
          border-radius: 23px;
          background: #EFF6FF;
          color: #0066FF;
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
          font-size: 16px;
        }

        .badge {
          display: inline-block;
          padding: 5px 12px;
          border-radius: 999px;
          font-size: 12px;
          font-weight: 700;
        }

        .badge.success {
          background: #DCFCE7;
          color: #10B981;
        }

        .badge.danger {
          background: #FEE2E2;
          color: #EF4444;
        }

        .badge.warning {
          background: #FEF3C7;
          color: #D97706;
        }

        .badge.info {
          background: #DBEAFE;
          color: #0066FF;
        }

        .badge.purple {
          background: #EFE9FE;
          color: #8B5CF6;
        }

        .detail-row {
          display: flex;
          justify-content: space-between;
          margin-bottom: 8px;
          font-size: 13px;
        }

        .detail-row span {
          color: #64748B;
        }

        .detail-row b {
          color: #0F172A;
          font-weight: 600;
        }

        .btn-row {
          display: flex;
          gap: 12px;
          margin-top: 12px;
        }

        .btn {
          border: none;
          border-radius: 12px;
          padding: 10px;
          font-size: 14px;
          font-weight: 700;
          text-align: center;
          cursor: pointer;
          flex: 1;
        }

        .btn-approve {
          background: #0066FF;
          color: #FFFFFF;
          transition: background 0.2s ease, transform 0.15s ease;
        }

        .btn-approve:hover {
          background: #0052CC;
          transform: translateY(-1px);
        }

        .btn-reject {
          background: #FEE2E2;
          color: #EF4444;
          transition: background 0.2s ease, transform 0.15s ease;
        }

        .btn-reject:hover {
          background: #fcd0d0;
          transform: translateY(-1px);
        }

        /* ===== BOTTOM NAVIGATION ===== */
        .bottom-nav {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          background: #FFFFFF;
          border-top: 1px solid #EAEFF5;
          border-radius: 24px 24px 0 0;
          padding: 8px 12px 14px;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03);
          z-index: 100;
          box-sizing: border-box;
          height: 68px;
        }

        .bottom-nav .tab,
        .nav-tab {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: #64748B;
          font-size: 11px;
          font-weight: 500;
          gap: 3px;
          user-select: none;
        }

        .bottom-nav .tab.active,
        .nav-tab.active {
          color: #2563EB;
          font-weight: 700;
        }

        .dashboard-pill-wrap,
        .nav-pill-wrap {
          background: #EEF4FF;
          border-radius: 16px;
          padding: 6px 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 1px;
        }

        .active-dot-indicator {
          width: 4px;
          height: 4px;
          border-radius: 2px;
          background: #2563EB;
          margin-top: 1px;
        }

        .nav-apply-btn-wrap {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          user-select: none;
          margin-top: -14px;
        }

        .nav-apply-circle {
          width: 48px;
          height: 48px;
          border-radius: 24px;
          background: #0066FF;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 6px 16px rgba(0, 102, 255, 0.4);
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-apply-btn-wrap:hover .nav-apply-circle {
          transform: scale(1.05);
          box-shadow: 0 8px 20px rgba(0, 102, 255, 0.5);
        }

        .nav-apply-label {
          font-size: 11px;
          font-weight: 700;
          color: #1E293B;
          margin-top: 4px;
        }
      </style>
    </head>

          <div class="tab nav-apply-btn-wrap" id="tab-apply" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-ApplyLeave')}else{window.location.href='../ApplyLeave/preview.html'}">
            <div class="nav-apply-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </div>
            <span class="nav-apply-label">Apply</span>
          </div>
          <div class="tab nav-tab" id="tab-history" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-LeaveHistory')}else{window.location.href='../LeaveHistory/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <polyline points="12 7 12 12 15 15"></polyline>
            </svg>
            <span>History</span>
          </div>
          <div class="tab nav-tab" id="tab-profile" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-MyProfile')}else{window.location.href='../MyProfile/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
          </div>
        </div>
      </div>

      <script>
        // Store initial rejected item in global PERSON_DATA
        (function() {
          const store = (typeof window !== 'undefined' && window.parent && window.parent.PERSON_DATA) ? window.parent : window;
          if (!store.PERSON_DATA) store.PERSON_DATA = {};
          store.PERSON_DATA['perm-init-1'] = {
            id: 'perm-init-1',
            name: 'Priya Sharma',
            empId: 'EMP-2024-0156',
            role: 'Senior Software Engineer',
            isPermission: true,
            type: 'Early Going',
            leaveType: 'Early Going',
            permissionType: 'Early Going',
            schedule: 'Sep 04 (03:00 - 05:00 PM)',
            fromDate: '04-Sep-2026',
            toDate: '04-Sep-2026',
            duration: '2 Hours',
            totalDays: '2 Hours',
            reason: 'Personal work',
            status: 'Rejected',
            approvingManager: 'Rahul Sharma (Team Lead)',
            emergencyContact: '+91 98765 22003',
            contact: '+91 98765 22003',
            subtitle: 'Early Going Application',
            appliedPath: 'Priya (Applied)'
          };
        })();

        let currentPermTab = 'pending';

        function switchPermTab(status, el) {
          currentPermTab = status;
          const pills = document.querySelectorAll('#perm-approval-tabs .tab-pill');
          pills.forEach(p => p.classList.remove('active'));
          if (el) el.classList.add('active');
          renderPermissionApprovals();
        }

        function formatTime12H(time24) {
          if (!time24) return '';
          const [hStr, mStr] = time24.split(':');
          let h = parseInt(hStr, 10);
          const m = mStr || '00';
          const ampm = h >= 12 ? 'PM' : 'AM';
          h = h % 12;
          if (h === 0) h = 12;
          const hDisplay = h < 10 ? '0' + h : h;
          return `${hDisplay}:${m} ${ampm}`;
        }

        function formatDateDisplay(dateStr) {
          if (!dateStr) return '04-Sep-2026';
          const parts = dateStr.split('-');
          if (parts.length === 3) {
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            const year = parts[0];
            const monthIdx = parseInt(parts[1], 10) - 1;
            const day = parts[2];
            if (months[monthIdx]) {
              return `${day}-${months[monthIdx]}-${year}`;
            }
          }
          return dateStr;
        }

        function calcPermDuration() {
          const startVal = document.getElementById('perm-start-time') ? document.getElementById('perm-start-time').value : '15:00';
          const endVal = document.getElementById('perm-end-time') ? document.getElementById('perm-end-time').value : '17:00';
          const durationBox = document.getElementById('perm-duration-box');
          if (!durationBox) return;

          if (startVal && endVal) {
            const [sH, sM] = startVal.split(':').map(Number);
            const [eH, eM] = endVal.split(':').map(Number);
            let startMin = sH * 60 + sM;
            let endMin = eH * 60 + eM;
            let diff = endMin - startMin;
            if (diff < 0) diff += 24 * 60;
            const hours = Math.floor(diff / 60);
            const mins = diff % 60;
            let text = '';
            if (hours > 0 && mins > 0) text = `${hours} Hr ${mins} Mins`;
            else if (hours > 0) text = `${hours} Hour${hours > 1 ? 's' : ''}`;
            else text = `${mins} Mins`;
            durationBox.textContent = `${text} (Auto-calculated)`;
          } else {
            durationBox.textContent = 'Auto-calculated';
          }
        }

        function syncPermTime(type, val) {
          const displayId = type === 'start' ? 'perm-start-time-display' : 'perm-end-time-display';
          const displayEl = document.getElementById(displayId);
          if (displayEl && val) {
            displayEl.value = formatTime12H(val);
          }
          calcPermDuration();
        }

        function openTimePicker(pickerId) {
          const picker = document.getElementById(pickerId);
          if (picker) {
            if (typeof picker.showPicker === 'function') {
              try {
                picker.showPicker();
              } catch (e) {
                picker.click();
              }
            } else {
              picker.click();
            }
          }
        }

        function processPermAction(id, newStatus, e) {
          if (e) {
            e.stopPropagation();
            e.preventDefault();
          }
          const card = document.querySelector(`#permission-approvals-list .approval-card[data-perm-id="${id}"]`);
          if (card) {
            card.setAttribute('data-status', newStatus);
            const actionWrap = card.querySelector('.card-action-wrap');
            if (actionWrap) {
              if (newStatus === 'approved') {
                actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge success">Approved</span></div>';
              } else {
                actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge danger">Rejected</span></div>';
              }
            }
            updatePermTabCounts();
            renderPermissionApprovals();
          }

          const permKey = id.startsWith('perm-') ? id : ('perm-' + id);
          const store = (typeof window !== 'undefined' && window.parent && window.parent.document) ? window.parent : window;

          let pName = 'Priya Sharma';
          let pType = 'Early Going';
          let pSchedule = 'Sep 04 (03:00 - 05:00 PM)';
          let pDuration = '2 Hours';
          let pReason = 'Personal work';

          if (card) {
            const bNodes = card.querySelectorAll('b');
            if (bNodes && bNodes.length >= 4) {
              pName = bNodes[0].innerText || pName;
              pSchedule = bNodes[1].innerText || pSchedule;
              pDuration = bNodes[2].innerText || pDuration;
              pReason = bNodes[3].innerText || pReason;
            }
            const typeNode = card.querySelector('.emp-row p') || card.querySelector('.badge');
            if (typeNode) pType = typeNode.innerText || pType;
          }

          const defEmpId = (store.USER_PROFILE && store.USER_PROFILE.employeeId) || 'EMP-2024-0156';
          const defRole = (store.USER_PROFILE && store.USER_PROFILE.role) || 'Senior Software Engineer';
          const defMgr = (store.USER_PROFILE && store.USER_PROFILE.reportingManager) || 'Rahul Sharma (Team Lead)';

          const permPersonObj = {
            id: id,
            name: pName,
            initials: (pName.trim().split(/\s+/).map(function(w){ return w[0]; }).join('').toUpperCase().slice(0, 2)) || 'PS',
            empId: defEmpId,
            role: defRole,
            isPermission: true,
            type: pType,
            leaveType: pType,
            permissionType: pType,
            schedule: pSchedule,
            fromDate: pSchedule,
            toDate: pSchedule,
            duration: pDuration,
            totalDays: pDuration,
            reason: pReason,
            status: newStatus.charAt(0).toUpperCase() + newStatus.slice(1),
            approvingManager: defMgr,
            contact: '+91 98765 22003',
            emergencyContact: '+91 98765 22003',
            subtitle: pType + ' Application',
            appliedPath: pName.split(' ')[0] + ' (Applied)'
          };

          if (!store.PERSON_DATA) store.PERSON_DATA = {};
          store.PERSON_DATA[permKey] = permPersonObj;
          store.PERSON_DATA[id] = permPersonObj;
          store.SELECTED_PERSON = permKey;

          // Persist decision globally
          store.LAST_PERMISSION_DECISION = permPersonObj;
          store.LAST_LEAVE_DECISION = permPersonObj;

          if (store.PERM_STATE) {
            store.PERM_STATE.forEach(function (req) {
              if (String(req.id) === String(id)) req.status = newStatus;
            });
          }

          // Direct navigation to Request Detail page!
          if (store.loadScreen) {
            store.loadScreen('tpl-LeaveApprovalDetail', permKey);
          } else if (window.parent && window.parent.loadScreen) {
            window.parent.loadScreen('tpl-LeaveApprovalDetail', permKey);
          } else if (typeof loadScreen === 'function') {
            loadScreen('tpl-LeaveApprovalDetail', permKey);
          }
        }

        function updatePermTabCounts() {
          const pending = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="pending"]').length;
          const approved = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="approved"]').length;
          const rejected = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="rejected"]').length;

          const countPending = document.getElementById('perm-count-pending');
          const countApproved = document.getElementById('perm-count-approved');
          const countRejected = document.getElementById('perm-count-rejected');

          if (countPending) countPending.textContent = pending;
          if (countApproved) countApproved.textContent = approved;
          if (countRejected) countRejected.textContent = rejected;
        }

        function renderPermissionApprovals() {
          let visibleCount = 0;
          const cards = document.querySelectorAll('#permission-approvals-list .approval-card');
          cards.forEach(card => {
            const status = card.getAttribute('data-status');
            if (status === currentPermTab) {
              card.style.display = 'block';
              visibleCount++;
            } else {
              card.style.display = 'none';
            }
          });

          const msg = document.getElementById('no-perm-msg');
          if (msg) {
            msg.style.display = visibleCount === 0 ? 'block' : 'none';
          }
        }

        // Initialize counts and view
        document.addEventListener('DOMContentLoaded', function() {
          updatePermTabCounts();
          renderPermissionApprovals();
        });
        setTimeout(function() {
          updatePermTabCounts();
          renderPermissionApprovals();
        }, 50);
      </script>
    </body>

    </html>
  </template>
