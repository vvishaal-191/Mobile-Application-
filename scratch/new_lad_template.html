          color: #D97706;

          margin-bottom: 24px;

        .step-line-dotted {

          height: 0;
          border-top: 2px dashed #CBD5E1;
          margin: 0 4px;
          margin-bottom: 24px;
        }

        /* Card 5: Manager Remarks (Optional) & Action Buttons */
        .remarks-card {
          margin-bottom: 20px;

        .remarks-body {
          padding: 12px 16px 16px 16px;
        }
        .remarks-textarea {

          padding: 10px 12px;
          font-size: 12.5px;
          min-height: 52px;

          margin-top: 4px;

          margin-top: 14px;

        .btn-action {

          height: 44px;

          font-size: 13.5px;
          font-weight: 700;

          align-items: center;
          justify-content: center;
          gap: 8px;
          cursor: pointer;
          transition: transform 0.15s, opacity 0.15s;

        .btn-action:active {

        .btn-approve {
          background: #DCFCE7;
          border: 1.5px solid #86EFAC;
          color: #15803D;
        }
        .btn-reject {
          background: #FEE2E2;
          border: 1.5px solid #FCA5A5;
          color: #DC2626;
        }
        .btn-circle-icon {
          width: 20px;
          height: 20px;
          border-radius: 50%;
          display: flex;
          align-items: center;
          justify-content: center;
        }

          background: #16A34A;
        }

        /* Bottom Navigation Bar */
        .bottom-nav {

        }
        .nav-apply-circle:active {
          transform: scale(0.93);
        }
        .nav-apply-label {
          font-size: 11px;
          font-weight: 700;
          color: #1D68F2;
          margin-top: 4px;
        }
      </style>

            <!-- Card 3: Reason for Leave -->
            <div class="card-block">

            <!-- Card 4: Approval Path -->
            <div class="card-block">
              <div class="card-title-bar">
                <div class="card-title-icon-box">
                  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="18" cy="5" r="3"></circle>
                    <circle cx="6" cy="12" r="3"></circle>

                    <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>

                        <polyline points="20 6 9 17 4 12"></polyline>

                  </div>

                  <!-- Connector 1 -->
                  <div class="step-line-solid"></div>

                  <!-- Step 2: Manager -->
                  <div class="step-node">

                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">

                  <!-- Connector 2 -->

                  <!-- Step 3: HR Desk -->
                  <div class="step-node">
                    <div class="step-circle grey">
                      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="3" y1="21" x2="21" y2="21"></line>
                        <line x1="3" y1="10" x2="21" y2="10"></line>

                        <line x1="6" y1="10" x2="6" y2="21"></line>

                        <line x1="14" y1="10" x2="14" y2="21"></line>
                        <line x1="18" y1="10" x2="18" y2="21"></line>
                      </svg>
                    </div>
                    <div class="step-name">HR Desk</div>
                    <div class="step-pill upcoming">Upcoming</div>
                  </div>
                </div>
              </div>
            </div>

            <!-- Card 5: Manager Remarks (Optional) & Action Buttons -->
            <div class="card-block remarks-card">
              <div class="card-title-bar">
                <div class="card-title-icon-box">
                  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path>
                    <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path>
                  </svg>
                </div>
                <div class="card-title-text">Manager Remarks (Optional)</div>
              </div>
              <div class="remarks-body">
                <textarea class="remarks-textarea" id="lad-remarks-input" placeholder="Add remarks here..." oninput="handleRemarksInput(this)"></textarea>
                <div class="char-counter" id="lad-char-counter">0/500</div>

                <div class="actions-row" id="lad-btn-row">
                  <button class="btn-action btn-approve" id="lad-btn-approve" onclick="handleDetailLeaveDecision('approved')">
                    <span class="btn-circle-icon green">
                      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                      </svg>
                    </span>
                    <span>Approve</span>
                  </button>
                  <button class="btn-action btn-reject" id="lad-btn-reject" onclick="handleDetailLeaveDecision('rejected')">
                    <span class="btn-circle-icon red">
                      <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                      </svg>
                    </span>
                    <span>Reject</span>
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
          <div class="nav-tab active" id="tab-dashboard" onclick="handleDetailBackNav()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>

          </div>
          <div class="nav-tab" id="tab-attendance" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-TeamAttendance')}else if(typeof loadScreen==='function'){loadScreen('tpl-TeamAttendance')}else{window.location.href='../TeamAttendance/preview.html'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Attendance</span>
          </div>
          <div class="nav-apply-wrap" id="tab-apply" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-ApplyLeave')}else if(typeof loadScreen==='function'){loadScreen('tpl-ApplyLeave')}else{window.location.href='../ApplyLeave/preview.html'}">
            <div class="nav-apply-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>

            <span class="nav-apply-label">Apply</span>

            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <polyline points="12 6 12 12 16 14"></polyline>
            </svg>
            <span>History</span>
          </div>
          <div class="nav-tab" id="tab-profile" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-MyProfile')}else if(typeof loadScreen==='function'){loadScreen('tpl-MyProfile')}else{window.location.href='../MyProfile/preview.html'}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
          </div>
        </div>

      <script>
        function handleRemarksInput(el) {
          const counter = document.getElementById('lad-char-counter');
          if (counter) {
            counter.textContent = el.value.length + '/500';
          }
        }

        function handleDetailBackNav() {
          const pWin = (window.parent && window.parent !== window) ? window.parent : window;
          if (pWin.loadScreen) {
            pWin.loadScreen('tpl-ManagerDashboard');
          } else if (typeof loadScreen === 'function') {
            loadScreen('tpl-ManagerDashboard');
          } else {
            window.location.href = '../ManagerDashboard/preview.html';
          }
        }

        function handleDetailLeaveDecision(status) {
          const isApproved = status === 'approved';
          const labelText = isApproved ? 'Approved' : 'Rejected';
          const badgeClass = isApproved ? 'badge success' : 'badge danger';

          const store = window.parent || window;
          const parentDoc = (window.parent && window.parent.document) ? window.parent.document : document;
          const currentPerson = (store.SELECTED_PERSON) || 'priya';

          if (!store.PERSON_DATA) store.PERSON_DATA = {};
          if (store.PERSON_DATA[currentPerson]) {
            store.PERSON_DATA[currentPerson].status = status;
          }

          store.LAST_LEAVE_DECISION = {
            id: currentPerson === 'priya' ? '1' : currentPerson,
            personKey: currentPerson,
            status: status,
            labelText: labelText,
            badgeClass: badgeClass,
            lType: (store.PERSON_DATA[currentPerson] && store.PERSON_DATA[currentPerson].leaveType) || 'Casual Leave'
          };
          store.lastLeaveDecision = store.LAST_LEAVE_DECISION;

          if (store.PERSON_DATA && store.PERSON_DATA[currentPerson] && store.PERSON_DATA[currentPerson].isPermission) {
            store.LAST_PERMISSION_DECISION = {
              id: currentPerson,
              status: status,
              type: store.PERSON_DATA[currentPerson].leaveType || 'Permission',
              date: store.PERSON_DATA[currentPerson].fromDate || '04-Sep-2026'
            };
            if (store.PERM_STATE) {
              store.PERM_STATE.forEach(function(req) {
                if (String(req.id) === String(currentPerson) || req.type === store.PERSON_DATA[currentPerson].leaveType) {
                  req.status = status;
                }
              });
            }
          }

          // 1. Update tpl-ManagerDashboard counters if needed
          const mgrTpl = parentDoc.getElementById('tpl-ManagerDashboard');
          if (mgrTpl) {
            let tplHtml = mgrTpl.innerHTML;
            const pObj = (store.PERSON_DATA && store.PERSON_DATA[currentPerson]) || {};
            if (pObj.isPermission) {
              tplHtml = tplHtml.replace(/class="qbadge" id="manager-dash-perm-badge">[0-9]+/, 'class="qbadge" id="manager-dash-perm-badge">0');
            } else {
              tplHtml = tplHtml.replace(/class="qbadge" id="manager-dash-leave-badge">[0-9]+/, 'class="qbadge" id="manager-dash-leave-badge">0');
            }
            mgrTpl.innerHTML = tplHtml;
          }

          // 2. Update EMP_LEAVE_REQUESTS & PERM_STATE so Employee Dashboard reflects it
          if (store.EMP_LEAVE_REQUESTS && store.EMP_LEAVE_REQUESTS.length > 0) {
            store.EMP_LEAVE_REQUESTS.forEach(function(req) {
              var pData = store.PERSON_DATA && store.PERSON_DATA[currentPerson];
              var idMatch = String(req.id) === String(currentPerson) || ('perm-' + req.id) === String(currentPerson) || String(req.id) === ('perm-' + currentPerson);
              var detailMatch = pData && (req.employeeName === (pData.name || pData.employeeName)) && (req.leaveType === (pData.leaveType || pData.type));
              if (idMatch || detailMatch) {
                req.status = status;
                if (isApproved) req.approvedAt = Date.now();
              }
            });
            var pObjDetail = (store.PERSON_DATA && store.PERSON_DATA[currentPerson]) || {};
            if (typeof store.updateEmploymentStatusAfterApproval === 'function') {
              store.updateEmploymentStatusAfterApproval(pObjDetail.name || pObjDetail.employeeName, pObjDetail.leaveType || pObjDetail.type, status);
            }
          }
          if (store.PERM_STATE && store.PERM_STATE.length > 0) {
            store.PERM_STATE.forEach(function(req) {
              if (String(req.id) === String(currentPerson) || ('perm-' + req.id) === String(currentPerson)) {
                req.status = status;
              }
            });
          }

          // Mark new notification & trigger subtle glow on Employee Dashboard
          store.HAS_NEW_NOTIFICATION = true;
          try { store.sessionStorage.setItem('HAS_NEW_NOTIFICATION', 'true'); } catch (e) {}
          if (typeof window !== 'undefined') {
            window.HAS_NEW_NOTIFICATION = true;
            try { sessionStorage.setItem('HAS_NEW_NOTIFICATION', 'true'); } catch (e) {}
          }
          const detailLiveBell = parentDoc.getElementById('dash-bell-btn') || parentDoc.querySelector('.dash-top .bell');
          if (detailLiveBell) detailLiveBell.classList.add('has-glow');

          // Inject notification into tpl-Notifications template if not present
          const notifTpl = parentDoc.getElementById('tpl-Notifications');
          if (notifTpl) {
            const pObj = (store.PERSON_DATA && store.PERSON_DATA[currentPerson]) || {};
            const isPermReq = !!(pObj.isPermission || (store.LAST_PERMISSION_DECISION && store.LAST_PERMISSION_DECISION.id === currentPerson));
            if (isPermReq) {
              if (!store.PERM_NOTIFICATIONS) store.PERM_NOTIFICATIONS = [];
              store.PERM_NOTIFICATIONS.unshift({
                status: status,
                type: pObj.leaveType || pObj.type || 'Permission',
                date: pObj.fromDate || pObj.schedule || '04-Sep-2026',
                managerName: (store.USER_PROFILE && store.USER_PROFILE.reportingManager) || 'Your Manager',
                employeeName: pObj.name || 'Employee'
              });
            } else {
              const lType = (pObj.leaveType || pObj.type || 'Casual Leave');
              const fromDate = (pObj.fromDate || 'Sep 10, 2026');
              const icoClass = isApproved ? 'success' : 'danger';
              const icoChar = isApproved ? '✓' : '✕';
              const msgText = isApproved
                ? 'Your ' + lType + ' request for ' + fromDate + ' has been <b>Approved</b> by the Manager'
                : 'Your ' + lType + ' request for ' + fromDate + ' has been <b>Rejected</b> by the Manager';
              const notifCard = '<div class="card notif-card unread" id="dynamic-leave-notif-' + currentPerson + '">'
                + '<div class="notif-row">'
                + '<span class="ico-wrap ' + icoClass + '">' + icoChar + '</span>'
                + '<div class="notif-text"><p>' + msgText + '</p><small>Just now</small></div>'
                + '<span class="dot"></span>'
                + '<span class="close-item-btn" onclick="this.closest(\'.notif-card\').remove()" title="Delete">✕</span>'
                + '</div></div>';
              let notifHtml = notifTpl.innerHTML;
              if (notifHtml.indexOf('dynamic-leave-notif-' + currentPerson) === -1) {
                notifHtml = notifHtml.replace('<div id="notif-container">', '<div id="notif-container">' + notifCard);
                notifTpl.innerHTML = notifHtml;
              }
            }
          }

          // 4. Update status on live Manager Dashboard if rendered
          const priyaMgrBadge = parentDoc.getElementById('dash-priya-status-badge') || document.getElementById('dash-priya-status-badge');
          if (priyaMgrBadge && (currentPerson === 'priya' || currentPerson === '1')) {
            priyaMgrBadge.className = badgeClass;
            priyaMgrBadge.textContent = labelText;
          }

          const liveEmpBadge = parentDoc.getElementById('emp-dash-casual-leave-badge') || document.getElementById('emp-dash-casual-leave-badge');
          if (liveEmpBadge) {
            liveEmpBadge.className = badgeClass;
            liveEmpBadge.textContent = labelText;
          }

          const liveQBadge = parentDoc.getElementById('manager-dash-leave-badge') || document.getElementById('manager-dash-leave-badge');
          if (liveQBadge) {
            liveQBadge.textContent = '2';
          }

          // 5. Update the current Request Detail screen's approval path, banner, and buttons dynamically
          const mgrPath = document.getElementById('lad-manager-path');
          if (mgrPath) {
            mgrPath.className = 'step-pill ' + (isApproved ? 'applied' : 'pending');
            mgrPath.style.background = isApproved ? '#DCFCE7' : '#FEE2E2';
            mgrPath.style.color = isApproved ? '#15803D' : '#DC2626';
            mgrPath.textContent = isApproved ? 'Approved' : 'Rejected';
          }

          const btnRow = document.getElementById('lad-btn-row');
          if (btnRow) {
            btnRow.innerHTML = '<div style="display:flex;flex-direction:column;gap:10px;width:100%;">'
              + '<div style="text-align:center;padding:12px;border-radius:12px;font-weight:700;font-size:14px;background:' + (isApproved ? '#DCFCE7' : '#FEE2E2') + ';color:' + (isApproved ? '#15803D' : '#DC2626') + ';border:1px solid ' + (isApproved ? '#86EFAC' : '#FCA5A5') + ';">'
              + (isApproved ? '✓ Approved by Manager' : '✕ Rejected by Manager')
              + '</div>'
              + '<div style="display:flex;gap:10px;">'
              + '<button class="btn-action ' + (isApproved ? 'btn-reject' : 'btn-approve') + '" style="flex:1;height:40px;font-size:13px;" onclick="handleDetailLeaveDecision(\'' + (isApproved ? 'rejected' : 'approved') + '\')">Change to ' + (isApproved ? 'Reject' : 'Approve') + '</button>'
              + '<button class="btn-action" style="flex:1;height:40px;font-size:13px;background:#1D68F2;color:#FFFFFF;border:none;" onclick="handleDetailBackNav()">Done →</button>'
              + '</div>'
              + '</div>';
          }
        }
      </script>
    </body>
    </html>
  </template>
