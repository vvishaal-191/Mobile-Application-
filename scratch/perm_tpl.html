<template id="tpl-ApplyPermission">
    <!DOCTYPE html>
    <html>

    <head>
      <meta charset="UTF-8" />
      <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
      <style>
        /* preview/base.css
   Shared "device frame" + design tokens used by every screen's preview.html
   so each screen's own CSS file only has to define screen-specific bits. */
        :root {
          --primary: #2F6BFF;
          --primary-dark: #1E4FD6;
          --bg: #F5F7FA;
          --surface: #FFFFFF;
          --navy: #1B2333;
          --text: #111827;
          --text-secondary: #6B7280;
          --text-muted: #9AA3B2;
          --success: #1FAE6E;
          --success-bg: #E3F8EE;
          --danger: #E5484D;
          --danger-bg: #FCE4E4;
          --warning: #F5A623;
          --warning-bg: #FDF0DA;
          --purple: #8B5CF6;
          --purple-bg: #EFE9FE;
          --info: #2F6BFF;
          --info-bg: #E7EEFF;
          --border: #E7EAF0;
          --chip: #EEF2FF;
        }

        * {
          box-sizing: border-box;
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        *::-webkit-scrollbar,
        html::-webkit-scrollbar,
        body::-webkit-scrollbar,
        .device::-webkit-scrollbar,
        .screen::-webkit-scrollbar,
        div::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
          background: transparent !important;
        }

        html, body, .device, .screen {
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        body {
          margin: 0;
          font-family: -apple-system, 'Segoe UI', Roboto, Arial, sans-serif;
          background: var(--bg);
          display: flex;
          justify-content: center;
          align-items: stretch;
          padding: 0;
          height: 100vh;
          height: 100dvh;
          overflow: hidden;
        }

        .device {
          width: 100%;
          max-width: 440px;
          height: 100vh;
          height: 100dvh;
          background: var(--bg);
          border-radius: 0;
          border: none;
          overflow: hidden;
          position: relative;
          box-shadow: none;
          display: flex;
          flex-direction: column;
          margin: 0 auto;
        }

        @media (min-width: 769px) {
          body {
            background: #0e1420;
            padding: 15px 0;
            align-items: center;
          }

          .device {
            border-radius: 40px;
            border: 8px solid #1f2937;
            height: 844px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .4);
          }
        }

        .statusbar { display: none !important; }

        .statusbar.dark { display: none !important; }

        .screen {
          flex: 1;
          overflow-y: auto;
          padding-bottom: 90px;
          -webkit-overflow-scrolling: touch;
          -ms-overflow-style: none !important;
          scrollbar-width: none !important;
        }

        .screen::-webkit-scrollbar {
          display: none !important;
          width: 0 !important;
          height: 0 !important;
        }

        .screen.dark {
          background: var(--navy);
        }

        /* Header */
        .header {
          display: flex;
          align-items: flex-start;
          gap: 12px;
          padding: 8px 20px 16px;
        }

        .header .mini-logo {
          width: 26px;
          height: 26px;
          object-fit: contain;
          border-radius: 4px;
          flex-shrink: 0;
          margin-top: 1px;
        }

        .header h1 {
          font-size: 22px;
          font-weight: 800;
          color: var(--text);
          margin: 0;
          line-height: 1.2;
        }

        .header p {
          font-size: 13px;
          color: var(--text-secondary);
          margin: 2px 0 0;
          line-height: 1.2;
        }


        .header h1 {
          font-size: 22px;
          font-weight: 800;
          color: var(--text);
          margin: 0;
        }

        .header p {
          font-size: 13px;
          color: var(--text-secondary);
          margin: 2px 0 0;
        }

        /* Card */
        .card {
          background: var(--surface);
          border: 1px solid var(--border);
          border-radius: 16px;
          padding: 16px;
          margin: 0 20px 16px;
        }

        /* Badge */
        .badge {
          display: inline-block;
          padding: 6px 14px;
          border-radius: 999px;
          font-size: 13px;
          font-weight: 700;
        }

        .badge.success {
          background: var(--success-bg);
          color: var(--success);
        }

        .badge.danger {
          background: var(--danger-bg);
          color: var(--danger);
        }

        .badge.warning {
          background: var(--warning-bg);
          color: var(--warning);
        }

        .badge.info {
          background: var(--info-bg);
          color: var(--primary);
        }

        .badge.purple {
          background: var(--purple-bg);
          color: var(--purple);
        }

        /* Buttons */
        .btn {
          border: none;
          border-radius: 14px;
          padding: 14px;
          font-size: 15px;
          font-weight: 700;
          text-align: center;
          cursor: pointer;
        }

        .btn-primary {
          background: var(--primary);
          color: #fff;
          transition: background 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
        }

        .btn-primary:hover {
          background: var(--primary-dark);
          box-shadow: 0 8px 24px rgba(47, 107, 255, 0.45);
          transform: translateY(-1px);
        }

        .btn-primary:active {
          transform: translateY(0);
          box-shadow: 0 4px 12px rgba(47, 107, 255, 0.3);
        }

        .btn-approve {
          background: #DFF7EC;
          color: var(--success);
        }

        .btn-reject {
          background: var(--danger-bg);
          color: var(--danger);
        }

        .btn-row {
          display: flex;
          gap: 12px;
          padding: 0 20px;
        }

        .btn-row .btn {
          flex: 1;
        }

        /* Pill tabs */
        .pill-tabs {
          display: flex;
          gap: 8px;
          padding: 12px 20px;
        }

        .pill {
          padding: 10px 18px;
          border-radius: 999px;
          font-size: 14px;
          font-weight: 600;
          color: var(--text-secondary);
          background: transparent;
          cursor: pointer;
          user-select: none;
        }

        .pill.active {
          background: var(--chip);
          color: var(--primary);
          font-weight: 700;
        }

        /* Bottom nav */
                .bottom-nav {
          position: absolute;
          bottom: 0;
          left: 0;
          right: 0;
          background: #FFFFFF;
          border-top: 1px solid #EAEFF5;
          border-radius: 24px 24px 0 0;
          padding: 8px 12px 14px;
          display: flex;
          align-items: flex-end;
          justify-content: space-between;
          box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.03);
          z-index: 100;
          box-sizing: border-box;
          height: 68px;
        }

        .bottom-nav .tab,
        .nav-tab {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          color: #64748B;
          font-size: 11px;
          font-weight: 500;
          gap: 3px;
          user-select: none;
        }

        .bottom-nav .tab.active,
        .nav-tab.active {
          color: #2563EB;
          font-weight: 700;
        }

        .dashboard-pill-wrap,
        .nav-pill-wrap {
          background: #EEF4FF;
          border-radius: 16px;
          padding: 6px 14px;
          display: flex;
          align-items: center;
          justify-content: center;
          margin-bottom: 1px;
        }

        .active-dot-indicator {
          width: 4px;
          height: 4px;
          border-radius: 2px;
          background: #2563EB;
          margin-top: 1px;
        }

        .nav-apply-btn-wrap {
          flex: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          cursor: pointer;
          user-select: none;
          margin-top: -14px;
        }

        .nav-apply-circle {
          width: 48px;
          height: 48px;
          border-radius: 24px;
          background: #2F6BFF;
          display: flex;
          align-items: center;
          justify-content: center;
          box-shadow: 0 6px 16px rgba(47, 107, 255, 0.4);
          transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .nav-apply-btn-wrap:hover .nav-apply-circle {
          transform: scale(1.05);
          box-shadow: 0 8px 20px rgba(47, 107, 255, 0.5);
        }

        .nav-apply-label {
          font-size: 11px;
          font-weight: 700;
          color: #1E293B;
          margin-top: 4px;
        }

        /* Avatar */
        .avatar {
          width: 48px;
          height: 48px;
          border-radius: 24px;
          background: #E3EBFF;
          color: var(--primary);
          display: flex;
          align-items: center;
          justify-content: center;
          font-weight: 800;
        }

        /* Progress bar */
        .progress {
          height: 8px;
          background: #E5E9F0;
          border-radius: 4px;
          overflow: hidden;
          margin: 8px 0 4px;
        }

        .progress>div {
          height: 100%;
          background: var(--primary);
          border-radius: 4px;
        }

        /* Section label */
        .section-label {
          font-size: 13px;
          font-weight: 700;
          color: var(--text-muted);
          letter-spacing: .5px;
          padding: 0 20px;
          margin: 8px 0;
        }

        input,
        textarea,
        select {
          width: 100%;
          border: 1px solid var(--border);
          border-radius: 12px;
          padding: 14px;
          font-size: 15px;
          color: var(--text);
          background: var(--surface);
          font-family: inherit;
          transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
        }

        input:hover,
        textarea:hover,
        select:hover,
        .field:hover input,
        .field:hover textarea,
        .field:hover select {
          border-color: var(--primary);
          box-shadow: 0 0 14px rgba(47, 107, 255, 0.3), 0 0 0 3.5px rgba(47, 107, 255, 0.15);
        }

        input:focus,
        textarea:focus,
        select:focus {
          outline: none;
          border-color: var(--primary);
          box-shadow: 0 0 18px rgba(47, 107, 255, 0.4), 0 0 0 4px rgba(47, 107, 255, 0.2);
        }

        .select-wrap {
          position: relative;
          width: 100%;
        }

        .select-wrap select {
          appearance: none;
          -webkit-appearance: none;
          -moz-appearance: none;
          padding-right: 44px;
          cursor: pointer;
        }

        .select-wrap .select-chevron {
          position: absolute;
          right: 14px;
          top: 50%;
          transform: translateY(-50%);
          width: 18px;
          height: 18px;
          display: flex;
          align-items: center;
          justify-content: center;
          pointer-events: none;
          color: #111827;
        }

        label.field-label {
          font-size: 14px;
          font-weight: 600;
          color: var(--text);
          margin-bottom: 8px;
          display: block;
        }

        .field {
          padding: 0 20px;
          margin-bottom: 18px;
          transition: transform 0.2s ease;
        }

        .mini-logo {
          width: 26px;
          height: 26px;
          object-fit: contain;
          border-radius: 4px;
        }

        .subtitle {
          padding: 0 20px;
          color: var(--text-secondary);
          margin: 4px 0 16px;
        }

        .field {
          padding: 0 20px;
          margin-bottom: 18px;
        }

        .field.two-col {
          display: flex;
          gap: 12px;
        }

        .field.two-col>div {
          flex: 1;
          padding: 0;
        }

        .auto-box {
          background: var(--info-bg);
          color: var(--primary);
          font-weight: 700;
          border-radius: 12px;
          padding: 14px;
        }

        .upload-box {
          border: 1.5px dashed var(--border);
          border-radius: 12px;
          padding: 24px;
          text-align: center;
          color: var(--text-secondary);
        }

        .btn.full {
          width: calc(100% - 40px);
          margin: 8px 20px 20px;
        }


        /* Uses ../ApplyLeave/preview.css as the base for shared form styling */
      </style>
    </head>

      <script>
        // preview/shared.js
        // Small reusable helpers for the static HTML previews (tab switching, etc).
        // Real interactivity/state lives in the React Native .jsx files - these
        // previews are just for visually checking the markup/CSS in a browser.

        function activatePill(el, groupSelector) {
          document.querySelectorAll(groupSelector).forEach((p) => p.classList.remove('active'));
          el.classList.add('active');
        }

        function toggleVisibility(id) {
          const input = document.getElementById(id);
          if (!input) return;
          input.type = input.type === 'password' ? 'text' : 'password';
        }

        function setActiveNav(el) {
          document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.classList.remove('active'));
          el.classList.add('active');
        }

      </script>
      <script>
        function calcPermDuration() {
          var durationInput = document.getElementById('perm-duration-input');
          var startInput = document.getElementById('perm-start-time');
          var endInput = document.getElementById('perm-end-time');
          if (startInput && endInput && startInput.value && endInput.value) {
            var sParts = startInput.value.split(':').map(Number);
            var eParts = endInput.value.split(':').map(Number);
            var diff = (eParts[0] * 60 + eParts[1]) - (sParts[0] * 60 + sParts[1]);
            if (diff < 0) diff += 24 * 60;
            var hours = Math.floor(diff / 60);
            var mins = diff % 60;
            var text = '';
            if (hours > 0 && mins > 0) text = hours + ' Hr ' + mins + ' Mins';
            else if (hours > 0) text = hours + ' Hour' + (hours > 1 ? 's' : '');
            else text = mins + ' Mins';
            if (durationInput) durationInput.value = text;
          } else if (durationInput && !durationInput.value) {
            durationInput.value = '2 Hours';
          }
        }
        window.calcPermDuration = calcPermDuration;

        function handleApplyPermissionSubmit() {
          var permDateInput  = document.getElementById('perm-date-input');
          var permTypeSelect = document.getElementById('perm-type-select');
          var durationInput  = document.getElementById('perm-duration-input');
          var reasonText     = document.getElementById('perm-reason-text');
          var permManagerEl  = document.getElementById('perm-manager-select');

          var rawDate   = permDateInput  ? permDateInput.value  : '2026-09-04';
          var months    = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
          var dp = rawDate.split('-');
          var fmtDate = dp.length === 3 ? (dp[2] + '-' + (months[parseInt(dp[1],10)-1]||'Sep') + '-' + dp[0]) : rawDate;

          var pType     = permTypeSelect ? permTypeSelect.value : 'Early Going';
          var pDuration = durationInput  ? (durationInput.value.trim() || '2 Hours') : '2 Hours';
          var pReason   = reasonText     ? (reasonText.value.trim()   || 'Personal work / checkup') : 'Personal work / checkup';

          var newId = 'perm-' + Date.now();
          var parentWin = window.parent || window;
          var permProf = parentWin.USER_PROFILE || {};
          var permEmpName = permProf.name || (parentWin.AUTH_USER && parentWin.AUTH_USER.name) || 'Sneha Reddy';
          var permEmpEmail = (permProf.email || (parentWin.AUTH_USER && parentWin.AUTH_USER.email) || 'sneha@gmail.com').toLowerCase();
          var permEmpInitials = permProf.initials || (permEmpName.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2)) || 'SR';
          var permEmpId = permProf.employeeId || (parentWin.AUTH_USER && parentWin.AUTH_USER.empId) || 'EMP-2024-0103';
          var permEmpRole = permProf.role || (parentWin.AUTH_USER && parentWin.AUTH_USER.jobTitle) || 'UI/UX Designer';
          var defPermMgr = permProf.reportingManager ? (permProf.reportingManager.indexOf('(') !== -1 ? permProf.reportingManager : permProf.reportingManager.split(' ')[0] + ' (Reporting Manager)') : 'Vishnu (Reporting Manager)';
          var pManager = permManagerEl ? permManagerEl.value : defPermMgr;

          var entry = {
            id: newId,
            type: pType,
            leaveType: pType,
            permissionType: pType,
            date: fmtDate,
            fromDate: fmtDate,
            toDate: fmtDate,
            duration: pDuration,
            daysText: pDuration,
            reason: pReason,
            status: 'pending',
            isPermission: true,
            employeeName: permEmpName,
            employeeEmail: permEmpEmail,
            employeeInitials: permEmpInitials,
            employeeId: permEmpId,
            employeeRole: permEmpRole,
            approvingManager: pManager,
            createdAt: Date.now()
          };
          if (!parentWin.PERM_STATE) parentWin.PERM_STATE = [];
          var existsPerm = parentWin.PERM_STATE.some(function(p){ return p.type === pType && p.date === fmtDate && p.reason === pReason; });
          if (!existsPerm) {
            parentWin.PERM_STATE.unshift(entry);
          }

          if (!parentWin.EMP_LEAVE_REQUESTS) parentWin.EMP_LEAVE_REQUESTS = [];
          var existsEmpReq = parentWin.EMP_LEAVE_REQUESTS.some(function(r){ return r.leaveType === pType && r.fromDate === fmtDate && r.reason === pReason; });
          if (!existsEmpReq) {
            parentWin.EMP_LEAVE_REQUESTS.unshift({ id: newId, leaveType: pType, fromDate: fmtDate, daysText: pDuration, reason: pReason, isPermission: true, employeeName: permEmpName, employeeEmail: permEmpEmail, employeeId: permEmpId, employeeRole: permEmpRole, status: 'pending' });
          }

          var permPersonObj = {
            id: newId,
            isPermission: true,
            type: pType,
            leaveType: pType,
            permissionType: pType,
            name: permEmpName,
            initials: permEmpInitials,
            role: permProf.role || 'Senior Software Engineer',
            empId: permEmpId,
            employeeId: permEmpId,
            employeeName: permEmpName,
            employeeInitials: permEmpInitials,
            status: 'pending',
            date: fmtDate,
            fromDate: fmtDate,
            toDate: fmtDate,
            duration: pDuration,
            totalDays: pDuration,
            reason: pReason,
            approvingManager: pManager,
            contact: pManager,
            emergencyContact: pManager,
            subtitle: pType + ' Application',
            appliedPath: permEmpName.split(' ')[0] + ' (Applied)'
          };
          if (!parentWin.PERSON_DATA) parentWin.PERSON_DATA = {};
          parentWin.PERSON_DATA[newId] = permPersonObj;
          parentWin.PERSON_DATA['priya'] = permPersonObj;
          parentWin.LATEST_REQUEST = permPersonObj;
          parentWin.LATEST_PERMISSION_REQUEST = permPersonObj;
          parentWin.SELECTED_PERSON = newId;

          var modal = document.getElementById('perm-success-modal');
          if (modal) {
            modal.classList.add('show');
          } else if (parentWin.loadScreen) {
            parentWin.loadScreen('tpl-EmployeeDashboard');
          }
        }
        window.handleApplyPermissionSubmit = handleApplyPermissionSubmit;

        function closePermSuccessModal() {
          var modal = document.getElementById('perm-success-modal');
          if (modal) modal.classList.remove('show');
          var parentWin = window.parent || window;
          if (parentWin.loadScreen) {
            parentWin.loadScreen('tpl-EmployeeDashboard');
          } else if (typeof loadScreen === 'function') {
            loadScreen('tpl-EmployeeDashboard');
          }
        }
        window.closePermSuccessModal = closePermSuccessModal;

        document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.addEventListener('click', () => setActiveNav(t)));
      </script>
    </body>
