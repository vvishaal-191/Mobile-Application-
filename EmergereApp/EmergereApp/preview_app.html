<script>
function activatePill(el, groupSelector) {
  document.querySelectorAll(groupSelector).forEach((p) => p.classList.remove('active'));
  el.classList.add('active');
}

function toggleVisibility(id) {
  const input = document.getElementById(id);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
}

function setActiveNav(el) {
  document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.classList.remove('active'));
  el.classList.add('active');
}

</script>
<script>
let appRemember = true;

function toggleRememberMeApp(el) {
  appRemember = !appRemember;
  const chk = document.getElementById('app-remember-chk');
  if (chk) {
    chk.textContent = appRemember ? '✓' : '';
    chk.style.background = appRemember ? '#8EC4EA' : 'transparent';
  }
}

function handleAppLogin() {
  const pwdInput = document.getElementById('login-pass');
  const pwdErr = document.getElementById('login-pass-err');
  if (!pwdInput || pwdInput.value.length < 8) {
    if (pwdErr) pwdErr.style.display = 'block';
    return;
  }
  if (pwdErr) pwdErr.style.display = 'none';
  if (window.parent && window.parent.loadScreen) {
    window.parent.loadScreen('tpl-EmployeeDashboard');
  } else if (typeof loadScreen === 'function') {
    loadScreen('tpl-EmployeeDashboard');
  }
}

function openAppForgotModal() {
  const forgotEmail = document.getElementById('app-forgot-email');
  const forgotContact = document.getElementById('app-forgot-contact');
  const modalErr = document.getElementById('app-modal-err');

  if (forgotEmail) forgotEmail.value = '';
  if (forgotContact) forgotContact.value = '';
  if (modalErr) modalErr.style.display = 'none';

  const modal = document.getElementById('app-forgot-modal');
  if (modal) modal.style.display = 'flex';
}

function closeAppForgotModal() {
  const modal = document.getElementById('app-forgot-modal');
  if (modal) modal.style.display = 'none';
}

function confirmAppForgot() {
  const emailInput = document.getElementById('app-forgot-email');
  const contactInput = document.getElementById('app-forgot-contact');
  const modalErr = document.getElementById('app-modal-err');

  const emailVal = emailInput ? emailInput.value.trim() : '';
  const contactVal = contactInput ? contactInput.value.trim() : '';

  const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
  const phoneRegex = /^\d{10}$/;

  if (!emailVal || !emailRegex.test(emailVal)) {
    if (modalErr) {
      modalErr.textContent = 'Please enter a valid registered Email ID.';
      modalErr.style.display = 'block';
    }
    return;
  }

  if (!contactVal || !phoneRegex.test(contactVal.replace(/[\s-]/g, ''))) {
    if (modalErr) {
      modalErr.textContent = 'Please enter a valid 10-digit registered Contact Number.';
      modalErr.style.display = 'block';
    }
    return;
  }

  if (modalErr) modalErr.style.display = 'none';
  closeAppForgotModal();

  if (window.parent && window.parent.loadScreen) {
    window.parent.loadScreen('tpl-EmployeeDashboard');
  } else if (typeof loadScreen === 'function') {
    loadScreen('tpl-EmployeeDashboard');
  }
}
</script>

<style>
/* preview/base.css
   Shared "device frame" + design tokens used by every screen's preview.html
   so each screen's own CSS file only has to define screen-specific bits. */
:root{
  --primary:#2F6BFF; --primary-dark:#1E4FD6; --bg:#F5F7FA; --surface:#FFFFFF;
  --navy:#1B2333; --text:#111827; --text-secondary:#6B7280; --text-muted:#9AA3B2;
  --success:#1FAE6E; --success-bg:#E3F8EE; --danger:#E5484D; --danger-bg:#FCE4E4;
  --warning:#F5A623; --warning-bg:#FDF0DA; --purple:#8B5CF6; --purple-bg:#EFE9FE;
  --info:#2F6BFF; --info-bg:#E7EEFF; --border:#E7EAF0; --chip:#EEF2FF;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg); display:flex; justify-content:center; align-items:stretch; padding:0; height:100vh; height:100dvh; overflow:hidden;
}
.device{
  width:100%; max-width:440px; height:100vh; height:100dvh; background:var(--bg); border-radius:0; border:none; overflow:hidden; position:relative; box-shadow:none; display:flex; flex-direction:column; margin:0 auto;
}
@media (min-width: 769px) {
  body { background:#0e1420; padding:15px 0; align-items:center; }
  .device { border-radius:40px; border:8px solid #1f2937; height:844px; box-shadow:0 20px 40px rgba(0,0,0,.4); }
}
.statusbar{
  display:flex; justify-content:space-between; align-items:center; padding:12px 20px 6px;
  font-weight:700; font-size:14px; color:var(--text); flex-shrink:0;
  padding-top: max(12px, env(safe-area-inset-top));
}
.statusbar.dark{color:#fff;}
.screen{ flex:1; overflow-y:auto; padding-bottom:90px; -webkit-overflow-scrolling:touch; }
.screen.dark{background:var(--navy);}

/* Header */
.header{display:flex; align-items:center; gap:12px; padding:8px 20px 16px;}
.back-btn{
  width:40px;height:40px;border-radius:20px;background:var(--info-bg);
  display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:18px;
}
.header h1{font-size:22px; font-weight:800; color:var(--text); margin:0;}
.header p{font-size:13px; color:var(--text-secondary); margin:2px 0 0;}

/* Card */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:16px; margin:0 20px 16px;
}

/* Badge */
.badge{display:inline-block; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700;}
.badge.success{background:var(--success-bg); color:var(--success);}
.badge.danger{background:var(--danger-bg); color:var(--danger);}
.badge.warning{background:var(--warning-bg); color:var(--warning);}
.badge.info{background:var(--info-bg); color:var(--primary);}
.badge.purple{background:var(--purple-bg); color:var(--purple);}

/* Buttons */
.btn{border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:700; text-align:center; cursor:pointer;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-approve{background:#DFF7EC; color:var(--success);}
.btn-reject{background:var(--danger-bg); color:var(--danger);}
.btn-row{display:flex; gap:12px; padding:0 20px;}
.btn-row .btn{flex:1;}

/* Pill tabs */
.pill-tabs{display:flex; gap:8px; padding:12px 20px;}
.pill{padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; color:var(--text-secondary); background:transparent; cursor:pointer; user-select:none;}
.pill.active{background:var(--chip); color:var(--primary); font-weight:700;}

/* Bottom nav */
.bottom-nav{
  position:absolute; bottom:0; left:0; right:0; background:var(--surface);
  border-top:1px solid var(--border); display:flex; padding:8px 0 18px; z-index:100;
}
.bottom-nav .tab{
  flex:1; text-align:center; font-size:11px; color:var(--text-muted); cursor:pointer;
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px;
}
.bottom-nav .tab .icon{
  display:flex; align-items:center; justify-content:center; height:22px; width:22px; margin-bottom:2px;
}
.bottom-nav .tab .icon svg{
  stroke:#6B7280; width:20px; height:20px; transition: stroke 0.2s ease;
}
.bottom-nav .tab.active{color:var(--primary); font-weight:700;}
.bottom-nav .tab.active .icon svg{stroke:var(--primary);}
.statusbar .status-icons{display:inline-flex; align-items:center; gap:5px; color:inherit;}

<script>
// Renders the Sep 2026 calendar grid with demo status dots (mirrors design).
const statusByDay = {1:'#1FAE6E',2:'#8B5CF6',3:'#1FAE6E',4:'#1FAE6E',5:'#8C93A3',6:'#8C93A3',
7:'#2F6BFF',8:'#1FAE6E',9:'#1FAE6E',10:'#F5A623',11:'#1FAE6E',12:'#8C93A3',13:'#8C93A3',
14:'#1FAE6E',15:'#E5484D',16:'#1FAE6E',17:'#1FAE6E',18:'#1FAE6E',19:'#8C93A3',20:'#8C93A3',
21:'#1FAE6E',22:'#1FAE6E',23:'#1FAE6E',24:'#1FAE6E',25:'#1FAE6E',26:'#8C93A3',27:'#8C93A3'};

const dayDetailsMap = {
  '#1FAE6E': { status: 'Present', color: '#1FAE6E', checkin: '09:15 AM', checkout: '06:15 PM', hours: '8h 30m' },
  '#E5484D': { status: 'Absent', color: '#E5484D', checkin: '--:--', checkout: '--:--', hours: '0h 0m' },
  '#2F6BFF': { status: 'On Leave', color: '#2F6BFF', checkin: '--:--', checkout: '--:--', hours: '0h 0m' },
  '#F5A623': { status: 'Permission (Early Exit)', color: '#F5A623', checkin: '09:15 AM', checkout: '04:15 PM', hours: '6h 30m' },
  '#8B5CF6': { status: 'Work From Home', color: '#8B5CF6', checkin: '09:00 AM', checkout: '06:00 PM', hours: '8h 30m' },
  '#8C93A3': { status: 'Week-Off / Holiday', color: '#8C93A3', checkin: '--:--', checkout: '--:--', hours: '0h 0m' }
};

const daysOfWeek = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
const monthsArr = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let currentYear = 2026;
let currentMonthIdx = 8; // Sep (0-indexed)

function renderCalendarGrid() {
  const grid = document.getElementById('grid');
  if (!grid) return;
  let html = '<div class="date-cell" style="opacity:0.4"><span class="num">31</span></div>';
  for (let d = 1; d <= 27; d++) {
    const sel = d === 3 ? 'selected' : '';
    const color = statusByDay[d] || '#1FAE6E';
    html += `<div class="date-cell ${sel}" onclick="selectCalendarDate(${d})" style="cursor:pointer;"><span class="num">${d}</span><span class="dot" style="background:${color}"></span></div>`;
  }
  grid.innerHTML = html;
}

function selectCalendarDate(day) {
  document.querySelectorAll('.date-cell').forEach(c => c.classList.remove('selected'));
  const cells = document.querySelectorAll('.date-cell');
  if (cells[day]) {
    cells[day].classList.add('selected');
  }
  const color = statusByDay[day] || '#1FAE6E';
  const info = dayDetailsMap[color] || dayDetailsMap['#1FAE6E'];
  const dayStr = String(day).padStart(2, '0');
  const monthName = monthsArr[currentMonthIdx].substring(0, 3);
  
  const dateObj = new Date(currentYear, currentMonthIdx, day);
  const dayOfWeek = daysOfWeek[dateObj.getDay()];

  document.getElementById('det-date').textContent = `${monthName} ${dayStr}, ${currentYear} (${dayOfWeek})`;
  document.getElementById('det-checkin').textContent = info.checkin;
  document.getElementById('det-checkout').textContent = info.checkout;
  document.getElementById('det-hours').textContent = info.hours;
  const statEl = document.getElementById('det-status');
  statEl.textContent = info.status;
  statEl.style.color = info.color;
}

function onMonthChange(val) {
  if (!val) return;
  const parts = val.split('-');
  currentYear = parseInt(parts[0], 10);
  currentMonthIdx = parseInt(parts[1], 10) - 1;
  const monthName = monthsArr[currentMonthIdx];
  const fullText = `${monthName} ${currentYear}`;
  
  const titleEl = document.getElementById('att-month-title');
  if (titleEl) titleEl.textContent = fullText;
  
  const labelEl = document.getElementById('picker-label');
  if (labelEl) labelEl.textContent = fullText;

  renderCalendarGrid();
  selectCalendarDate(1);
}

renderCalendarGrid();

const monthsShortArr = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
let activeTeamDateObj = new Date(2026, 8, 3); // Sep 3, 2026

function formatTeamDateString(d) {
  const mStr = monthsShortArr[d.getMonth()];
  const dayStr = String(d.getDate()).padStart(2, '0');
  const yrStr = d.getFullYear();
  return `${mStr} ${dayStr}, ${yrStr}`;
}

function updateTeamDateNavDisplay() {
  const textEl = document.getElementById('team-date-text');
  if (textEl) textEl.textContent = formatTeamDateString(activeTeamDateObj);
}

function changeTeamDate(deltaDays) {
  activeTeamDateObj.setDate(activeTeamDateObj.getDate() + deltaDays);
  updateTeamDateNavDisplay();
}

document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.addEventListener('click', () => setActiveNav(t)));

</script>

<script>
function formatDateString(dateVal) {
  if (!dateVal) return '07-Sep-2026';
  const parts = dateVal.split('-');
  const yr = parts[0];
  const mIdx = parseInt(parts[1], 10) - 1;
  const day = parts[2];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${day}-${months[mIdx]}-${yr}`;
}

function updateLeaveDates() {
  const fromPicker = document.getElementById('from-date-picker');
  const toPicker = document.getElementById('to-date-picker');
  const fromDisplay = document.getElementById('from-date-display');
  const toDisplay = document.getElementById('to-date-display');
  const daysBox = document.getElementById('days-count-box');

  if (fromPicker && fromDisplay && fromPicker.value) {
    fromDisplay.value = formatDateString(fromPicker.value);
  }
  if (toPicker && toDisplay && toPicker.value) {
    toDisplay.value = formatDateString(toPicker.value);
  }

  if (fromPicker && toPicker && daysBox && fromPicker.value && toPicker.value) {
    const d1 = new Date(fromPicker.value);
    const d2 = new Date(toPicker.value);
    if (!isNaN(d1) && !isNaN(d2)) {
      const diffTime = d2.getTime() - d1.getTime();
      let diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24)) + 1;
      if (diffDays < 1) diffDays = 1;
      daysBox.textContent = `${diffDays}.0 Day${diffDays > 1 ? 's' : ''} (Auto-calculated)`;
    }
  }
}

document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.addEventListener('click', () => setActiveNav(t)));

</script>

.header h1{font-size:22px; font-weight:800; color:var(--text); margin:0;}
.header p{font-size:13px; color:var(--text-secondary); margin:2px 0 0;}

/* Card */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:16px; margin:0 20px 16px;
}

/* Badge */
.badge{display:inline-block; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700;}
.badge.success{background:var(--success-bg); color:var(--success);}
.badge.danger{background:var(--danger-bg); color:var(--danger);}
.badge.warning{background:var(--warning-bg); color:var(--warning);}
.badge.info{background:var(--info-bg); color:var(--primary);}
.badge.purple{background:var(--purple-bg); color:var(--purple);}

/* Buttons */
.btn{border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:700; text-align:center; cursor:pointer;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-approve{background:#DFF7EC; color:var(--success);}
.btn-reject{background:var(--danger-bg); color:var(--danger);}
.btn-row{display:flex; gap:12px; padding:0 20px;}
.btn-row .btn{flex:1;}

/* Pill tabs */
.pill-tabs{display:flex; gap:8px; padding:12px 20px;}
.pill{padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; color:var(--text-secondary); background:transparent; cursor:pointer; user-select:none;}
.pill.active{background:var(--chip); color:var(--primary); font-weight:700;}

/* Bottom nav */
.bottom-nav{
  position:absolute; bottom:0; left:0; right:0; background:var(--surface);
  border-top:1px solid var(--border); display:flex; padding:10px 0 22px;
}
.bottom-nav .tab{flex:1; text-align:center; font-size:11px; color:var(--text-muted);}
.bottom-nav .tab .icon{font-size:20px; display:block; margin-bottom:2px;}
.bottom-nav .tab.active{color:var(--primary); font-weight:700;}

/* Avatar */
.avatar{
  width:48px;height:48px;border-radius:24px;background:#E3EBFF;color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;
}

/* Progress bar */
.progress{height:8px; background:#E5E9F0; border-radius:4px; overflow:hidden; margin:8px 0 4px;}
.progress > div{height:100%; background:var(--primary); border-radius:4px;}

/* Section label */
.section-label{font-size:13px; font-weight:700; color:var(--text-muted); letter-spacing:.5px; padding:0 20px; margin:8px 0;}

input, textarea, select{
  width:100%; border:1px solid var(--border); border-radius:12px; padding:14px;
  font-size:15px; color:var(--text); background:var(--surface); font-family:inherit;
}
label.field-label{font-size:14px; font-weight:600; color:var(--text); margin-bottom:8px; display:block;}
.field{padding:0 20px; margin-bottom:18px;}


.mini-logo{width:22px;height:22px;}
.subtitle{padding:0 20px;color:var(--text-secondary);margin:4px 0 4px;}
.req-row{display:flex;justify-content:space-between;align-items:flex-start;}
.req-left{display:flex;gap:12px;}
.req-left p{margin:4px 0 0;color:var(--text-secondary);font-size:13px;}
.ico{font-size:20px;}
.ico.success{color:var(--success);} .ico.warning{color:var(--warning);} .ico.danger{color:var(--danger);}
.remark{color:var(--text-secondary);font-style:italic;font-size:13px;margin:0;}
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:999;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal-card{background:#fff;border-radius:20px;width:100%;max-width:380px;padding:20px;box-shadow:0 10px 25px rgba(0,0,0,0.25);animation:popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);}

.req-card:hover{transform:translateY(-2px);}

function activatePill(el, groupSelector) {
  document.querySelectorAll(groupSelector).forEach((p) => p.classList.remove('active'));

}

function toggleVisibility(id) {
  const input = document.getElementById(id);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
}

function setActiveNav(el) {
  document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.classList.remove('active'));

}

  const card = document.querySelector(`.approval-card[data-leave-id="${id}"]`);
  if (card) {

      }
    }
  }

  const isApproved = newStatus === 'approved';
  const labelText = isApproved ? 'Approved' : 'Rejected';
  const badgeClass = isApproved ? 'badge success' : 'badge danger';

  const parentDoc = (window.parent && window.parent.document) ? window.parent.document : document;

  // Update tpl-EmployeeDashboard template in DOM
  const empTpl = parentDoc.getElementById('tpl-EmployeeDashboard');
  if (empTpl) {

      '<span id="emp-dash-casual-leave-badge" class="' + badgeClass + '">' + labelText + '</span>'
    );
    empTpl.innerHTML = tplHtml;
  }

  // Update live element if currently rendered
  const liveEmpBadge = parentDoc.getElementById('emp-dash-casual-leave-badge') || document.getElementById('emp-dash-casual-leave-badge');
  if (liveEmpBadge) {
    liveEmpBadge.className = badgeClass;
    liveEmpBadge.textContent = labelText;
  }

  updateLeaveTabCounts();
  renderLeaveApprovals();
}

function updateLeaveTabCounts() {
  const pending = document.querySelectorAll('.approval-card[data-status="pending"]').length;
  const approved = document.querySelectorAll('.approval-card[data-status="approved"]').length;
  const rejected = document.querySelectorAll('.approval-card[data-status="rejected"]').length;

  const countPending = document.getElementById('count-pending');
  const countApproved = document.getElementById('count-approved');
  const countRejected = document.getElementById('count-rejected');

  if (countPending) countPending.textContent = pending;
  if (countApproved) countApproved.textContent = approved;
  if (countRejected) countRejected.textContent = rejected;
}

function renderLeaveApprovals() {
  let visibleCount = 0;
  const cards = document.querySelectorAll('.approval-card');
  cards.forEach(card => {
    const status = card.getAttribute('data-status');

      card.style.display = 'block';
      visibleCount++;
    } else {

  });

  if (msg) {
    msg.style.display = visibleCount === 0 ? 'block' : 'none';

  --warning:#F5A623; --warning-bg:#FDF0DA; --purple:#8B5CF6; --purple-bg:#EFE9FE;
  --info:#2F6BFF; --info-bg:#E7EEFF; --border:#E7EAF0; --chip:#EEF2FF;
}
*{box-sizing:border-box;}
body{
  margin:0; font-family:-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  background:var(--bg); display:flex; justify-content:center; align-items:stretch; padding:0; height:100vh; height:100dvh; overflow:hidden;
}
.device{
  width:100%; max-width:440px; height:100vh; height:100dvh; background:var(--bg); border-radius:0; border:none; overflow:hidden; position:relative; box-shadow:none; display:flex; flex-direction:column; margin:0 auto;
}
@media (min-width: 769px) {
  body { background:#0e1420; padding:15px 0; align-items:center; }
  .device { border-radius:40px; border:8px solid #1f2937; height:844px; box-shadow:0 20px 40px rgba(0,0,0,.4); }
}
.statusbar{
  display:flex; justify-content:space-between; align-items:center; padding:12px 20px 6px;
  font-weight:700; font-size:14px; color:var(--text); flex-shrink:0;
  padding-top: max(12px, env(safe-area-inset-top));
}
.statusbar.dark{color:#fff;}
.screen{ flex:1; overflow-y:auto; padding-bottom:90px; -webkit-overflow-scrolling:touch; }
.screen.dark{background:var(--navy);}

/* Header */
.header{display:flex; align-items:center; gap:12px; padding:8px 20px 16px;}
.back-btn{
  width:40px;height:40px;border-radius:20px;background:var(--info-bg);
  display:flex;align-items:center;justify-content:center;color:var(--primary);font-size:18px;
}
.header h1{font-size:22px; font-weight:800; color:var(--text); margin:0;}
.header p{font-size:13px; color:var(--text-secondary); margin:2px 0 0;}

/* Card */
.card{
  background:var(--surface); border:1px solid var(--border); border-radius:16px;
  padding:16px; margin:0 20px 16px;
}

/* Badge */
.badge{display:inline-block; padding:6px 14px; border-radius:999px; font-size:13px; font-weight:700;}
.badge.success{background:var(--success-bg); color:var(--success);}
.badge.danger{background:var(--danger-bg); color:var(--danger);}
.badge.warning{background:var(--warning-bg); color:var(--warning);}
.badge.info{background:var(--info-bg); color:var(--primary);}
.badge.purple{background:var(--purple-bg); color:var(--purple);}

/* Buttons */
.btn{border:none; border-radius:14px; padding:14px; font-size:15px; font-weight:700; text-align:center; cursor:pointer;}
.btn-primary{background:var(--primary); color:#fff;}
.btn-approve{background:#DFF7EC; color:var(--success);}
.btn-reject{background:var(--danger-bg); color:var(--danger);}
.btn-row{display:flex; gap:12px; padding:0 20px;}
.btn-row .btn{flex:1;}

/* Pill tabs */
.pill-tabs{display:flex; gap:8px; padding:12px 20px;}
.pill{padding:10px 18px; border-radius:999px; font-size:14px; font-weight:600; color:var(--text-secondary); background:transparent; cursor:pointer; user-select:none;}
.pill.active{background:var(--chip); color:var(--primary); font-weight:700;}

/* Bottom nav */
.bottom-nav{
  position:absolute; bottom:0; left:0; right:0; background:var(--surface);
  border-top:1px solid var(--border); display:flex; padding:10px 0 22px;
}
.bottom-nav .tab{flex:1; text-align:center; font-size:11px; color:var(--text-muted);}
.bottom-nav .tab .icon{font-size:20px; display:block; margin-bottom:2px;}
.bottom-nav .tab.active{color:var(--primary); font-weight:700;}

/* Avatar */
.avatar{
  width:48px;height:48px;border-radius:24px;background:#E3EBFF;color:var(--primary);
  display:flex;align-items:center;justify-content:center;font-weight:800;
}

/* Progress bar */
.progress{height:8px; background:#E5E9F0; border-radius:4px; overflow:hidden; margin:8px 0 4px;}
.progress > div{height:100%; background:var(--primary); border-radius:4px;}

/* Section label */
.section-label{font-size:13px; font-weight:700; color:var(--text-muted); letter-spacing:.5px; padding:0 20px; margin:8px 0;}

input, textarea, select{
  width:100%; border:1px solid var(--border); border-radius:12px; padding:14px;
  font-size:15px; color:var(--text); background:var(--surface); font-family:inherit;
}
label.field-label{font-size:14px; font-weight:600; color:var(--text); margin-bottom:8px; display:block;}
.field{padding:0 20px; margin-bottom:18px;}

.approval-card{padding:16px;margin:0 20px 16px;}
.top-row{display:flex;justify-content:space-between;align-items:flex-start;}
.emp-row{display:flex;gap:12px;align-items:center;}
.emp-row p{margin:2px 0 0;color:var(--text-secondary);font-size:13px;}
hr{border:none;border-top:1px solid var(--border);margin:14px 0;}
.detail-row{display:flex;justify-content:space-between;margin-bottom:8px;}
.detail-row span{color:var(--text-secondary);}
.btn-row{display:flex;gap:12px;margin-top:12px;padding:0;}

// preview/shared.js
// Small reusable helpers for the static HTML previews (tab switching, etc).
// Real interactivity/state lives in the React Native .jsx files - these
// previews are just for visually checking the markup/CSS in a browser.

function activatePill(el, groupSelector) {
  document.querySelectorAll(groupSelector).forEach((p) => p.classList.remove('active'));
  el.classList.add('active');
}

function toggleVisibility(id) {
  const input = document.getElementById(id);
  if (!input) return;
  input.type = input.type === 'password' ? 'text' : 'password';
}

function setActiveNav(el) {
  document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.classList.remove('active'));
  el.classList.add('active');
}

</script>
<script>
function filterHistory(cat, el) {
  const pills = el.parentElement.querySelectorAll('.pill');
  pills.forEach(p => p.classList.remove('active'));
  el.classList.add('active');

  const cards = document.querySelectorAll('.req-card');
  cards.forEach(card => {
    const type = card.getAttribute('data-type');
    if (cat === 'all' || type === cat) {
      card.style.display = 'block';
    } else {
      card.style.display = 'none';
    }
  });
}
document.querySelectorAll('.bottom-nav .tab').forEach((t) => t.addEventListener('click', () => setActiveNav(t)));

let currentPermTab = 'pending';

function switchPermTab(status, el) {
  currentPermTab = status;
  const pills = el.parentElement.querySelectorAll('.pill');
  pills.forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderPermissionApprovals();
}

function processPermAction(id, newStatus) {
  const card = document.querySelector(`#permission-approvals-list .approval-card[data-perm-id="${id}"]`);
  if (!card) return;
  
  card.setAttribute('data-status', newStatus);
  const actionWrap = card.querySelector('.card-action-wrap');
  if (actionWrap) {
    if (newStatus === 'approved') {
      actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge success">Approved</span></div>';
    } else {
      actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge danger">Rejected</span></div>';
    }
  }

  updatePermTabCounts();
  renderPermissionApprovals();
}

function updatePermTabCounts() {
  const pending = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="pending"]').length;
  const approved = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="approved"]').length;
  const rejected = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="rejected"]').length;

  const countPending = document.getElementById('perm-count-pending');
  const countApproved = document.getElementById('perm-count-approved');
  const countRejected = document.getElementById('perm-count-rejected');

  if (countPending) countPending.textContent = pending;
  if (countApproved) countApproved.textContent = approved;
  if (countRejected) countRejected.textContent = rejected;
}

function renderPermissionApprovals() {
  let visibleCount = 0;
  const cards = document.querySelectorAll('#permission-approvals-list .approval-card');
  cards.forEach(card => {
    const status = card.getAttribute('data-status');
    if (status === currentPermTab) {
      card.style.display = 'block';
      visibleCount++;
    } else {
      card.style.display = 'none';
    }
  });

  const msg = document.getElementById('no-perm-msg');
  if (msg) {
    msg.style.display = visibleCount === 0 ? 'block' : 'none';
  }
}

</script>

<script>
  var currentTpl = 'tpl-Login';

  function toggleMobileMenu() {
    var sb = document.getElementById('sidebar');
    var ov = document.getElementById('sidebar-overlay');
    if (sb && ov) {
      sb.classList.toggle('open');
      ov.classList.toggle('open');
    }
  }

  function closeMobileMenu() {
    var sb = document.getElementById('sidebar');
    var ov = document.getElementById('sidebar-overlay');
    if (sb && ov) {
      sb.classList.remove('open');
      ov.classList.remove('open');
    }
  }

  function loadScreen(tplId) {
    var tpl = document.getElementById(tplId);
    if (!tpl) return;
    currentTpl = tplId;
    var frame = document.getElementById('frame');
    frame.srcdoc = tpl.innerHTML;
    document.querySelectorAll('.nav-btn').forEach(function(b) {
      b.classList.toggle('active', b.getAttribute('data-tpl') === tplId);
    });
    closeMobileMenu();
  }

  var frame = document.getElementById('frame');
  frame.addEventListener('load', function() {
    var doc = frame.contentDocument || (frame.contentWindow && frame.contentWindow.document);
    if (!doc) return;

    var tabs = doc.querySelectorAll('.bottom-nav .tab');
    var tabMap = {
      'dashboard': 'tpl-EmployeeDashboard',
      'attendance': 'tpl-MyAttendance',
      'apply': 'tpl-ApplyLeave',
      'history': 'tpl-LeaveHistory',
      'more': 'tpl-MyProfile',
      'profile': 'tpl-MyProfile'
    };
    tabs.forEach(function(tab) {
      tab.style.cursor = 'pointer';
      tab.addEventListener('click', function(e) {
        var label = tab.textContent.toLowerCase();
        for (var key in tabMap) {
          if (label.indexOf(key) !== -1) {
            loadScreen(tabMap[key]);
            break;
          }
        }
      });
    });

    var backBtns = doc.querySelectorAll('.back-btn, [class*="back"]');
    backBtns.forEach(function(btn) {
      btn.style.cursor = 'pointer';
      btn.addEventListener('click', function() {
        if (currentTpl.indexOf('Manager') !== -1 || currentTpl === 'tpl-TeamAttendance' || currentTpl === 'tpl-LeaveApprovals' || currentTpl === 'tpl-PermissionApprovals' || currentTpl === 'tpl-LeaveApprovalDetail') {
          loadScreen('tpl-ManagerDashboard');
        } else {
          loadScreen('tpl-EmployeeDashboard');
        }
      });
    });

    if (currentTpl === 'tpl-Login') {
      var loginBtn = doc.querySelector('button.btn-primary, .btn-primary');
      if (loginBtn) {
        loginBtn.style.cursor = 'pointer';
        loginBtn.addEventListener('click', function(e) {
          e.preventDefault();
          loadScreen('tpl-EmployeeDashboard');
        });
      }
    }

    if (currentTpl === 'tpl-LeaveApprovals') {
      doc.querySelectorAll('.approval-card, .card').forEach(function(card) {
        card.style.cursor = 'pointer';
        card.addEventListener('click', function(e) {
          if (e.target.tagName !== 'BUTTON') {
            loadScreen('tpl-LeaveApprovalDetail');
          }
        });
      });
    }
  });

  document.querySelectorAll('.nav-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      loadScreen(btn.getAttribute('data-tpl'));
    });
  });

  loadScreen('tpl-Login');
</script>
