<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Leave Approvals - Preview</title>
<link rel="stylesheet" href="../../../preview/base.css"/>
<link rel="stylesheet" href="./preview.css"/></head>
<body>
<div class="device">
<div class="screen">
  <div class="header"><div class="back-btn">←</div><img class="mini-logo" src="../../../assets/emergere-logo.png" alt="Emergere Logo"/><div><h1>Leave Approvals</h1><p>Manage Team Requests</p></div></div>
    <div class="pill-tabs" id="leave-approval-tabs">
    <div class="pill active" id="tab-pill-pending" onclick="switchLeaveTab('pending', this)">Pending (<span id="count-pending">0</span>)</div>
    <div class="pill" id="tab-pill-approved" onclick="switchLeaveTab('approved', this)">Approved (<span id="count-approved">0</span>)</div>
    <div class="pill" id="tab-pill-rejected" onclick="switchLeaveTab('rejected', this)">Rejected (<span id="count-rejected">0</span>)</div>
  </div>

  <div id="leave-approvals-list">
    <div id="no-leave-msg" style="display:block; text-align:center; padding:30px 20px; color:var(--text-secondary); font-size:14px; background:#fff; margin:0 20px; border-radius:16px; border:1px solid var(--border);"></div>
  </div>
</div>
<div class="bottom-nav">
  <div class="tab active"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect></svg></span>Dashboard</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>Attendance</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg></span>Apply</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><polyline points="12 7 12 12 15 15"></polyline></svg></span>History</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg></span>Profile</div>
</div>
</div>
<script src="../../../preview/shared.js"></script>
<script src="./preview.js"></script>
<script>
let currentLeaveTab = 'pending';

function switchLeaveTab(status, el) {
  currentLeaveTab = status;
  const pills = el.parentElement.querySelectorAll('.pill');
  pills.forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderLeaveApprovals();
}

function processLeaveAction(id, newStatus) {
  const card = document.querySelector(`.approval-card[data-leave-id="${id}"]`);
  if (!card) return;
  
  card.setAttribute('data-status', newStatus);
  const actionWrap = card.querySelector('.card-action-wrap');
  if (actionWrap) {
    if (newStatus === 'approved') {
      actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge success">Approved</span></div>';
    } else {
      actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge danger">Rejected</span></div>';
    }
  }

  updateLeaveTabCounts();
  renderLeaveApprovals();
}

function updateLeaveTabCounts() {
  const pending = document.querySelectorAll('.approval-card[data-status="pending"]').length;
  const approved = document.querySelectorAll('.approval-card[data-status="approved"]').length;
  const rejected = document.querySelectorAll('.approval-card[data-status="rejected"]').length;

  const countPending = document.getElementById('count-pending');
  const countApproved = document.getElementById('count-approved');
  const countRejected = document.getElementById('count-rejected');

  if (countPending) countPending.textContent = pending;
  if (countApproved) countApproved.textContent = approved;
  if (countRejected) countRejected.textContent = rejected;
}

function renderLeaveApprovals() {
  let visibleCount = 0;
  const cards = document.querySelectorAll('.approval-card');
  cards.forEach(card => {
    const status = card.getAttribute('data-status');
    if (status === currentLeaveTab) {
      card.style.display = 'block';
      visibleCount++;
    } else {
      card.style.display = 'none';
    }
  });

  const msg = document.getElementById('no-leave-msg');
  if (msg) {
    msg.style.display = visibleCount === 0 ? 'block' : 'none';
  }
}
</script>
</body></html>
