<!DOCTYPE html>
<html><head><meta charset="UTF-8"/><title>My Attendance - Preview</title>
<link rel="stylesheet" href="../../../preview/base.css"/>
<link rel="stylesheet" href="./preview.css"/></head>
<body>
<div class="device">
  <div class="screen">
    <div class="header"><img class="mini-logo" src="../../../assets/emergere-logo.png"/><h1>My Attendance</h1></div>
    <p class="month">September 2026</p>
    <div class="pill-tabs">
      <div class="pill active" onclick="activatePill(this,'.pill-tabs .pill')">September 2026</div>
    </div>
    <div class="legend">
      <span><i style="background:#1FAE6E"></i>Present</span>
      <span><i style="background:#E5484D"></i>Absent</span>
      <span><i style="background:#2F6BFF"></i>Leave</span>
      <span><i style="background:#F5A623"></i>Permission</span>
      <span><i style="background:#8B5CF6"></i>WFH</span>
      <span><i style="background:#8C93A3"></i>Week-Off</span>
    </div>
    <div class="card calendar-card">
      <div class="week-row"><span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span></div>
      <div class="dates-grid" id="grid"></div>
    </div>
    <div class="card">
      <p class="details-title">TODAY'S DETAILS</p>
      <div class="detail-row"><span>Date</span><b>Sep 03, 2026 (Thu)</b></div>
      <div class="detail-row"><span>Check-In Time</span><b>09:15 AM</b></div>
      <div class="detail-row"><span>Check-Out Time</span><b>--:--</b></div>
      <div class="detail-row"><span>Working Hours</span><b>6h 45m</b></div>
      <div class="detail-row"><span>Status</span><b>Present</b></div>
    </div>
  </div>
  <div class="bottom-nav">
          <div class="tab nav-tab" id="tab-dashboard" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-EmployeeDashboard')}else{window.location.href='../EmployeeDashboard/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
              <polyline points="9 22 9 12 15 12 15 22"></polyline>
            </svg>
            <span>Dashboard</span>
          </div>
          <div class="tab nav-tab active" id="tab-attendance">
            <div class="nav-pill-wrap">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#2563EB" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
                <line x1="16" y1="2" x2="16" y2="6"></line>
                <line x1="8" y1="2" x2="8" y2="6"></line>
                <line x1="3" y1="10" x2="21" y2="10"></line>
              </svg>
            </div>
            <span>Attendance</span>
            <span class="active-dot-indicator"></span>
          </div>
          <div class="tab nav-apply-btn-wrap" id="tab-apply" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-ApplyLeave')}else{window.location.href='../ApplyLeave/preview.html'}">
            <div class="nav-apply-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </div>
            <span class="nav-apply-label">Apply</span>
          </div>
          <div class="tab nav-tab" id="tab-history" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-LeaveHistory')}else{window.location.href='../LeaveHistory/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <polyline points="12 7 12 12 15 15"></polyline>
            </svg>
            <span>History</span>
          </div>
          <div class="tab nav-tab" id="tab-profile" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-MyProfile')}else{window.location.href='../MyProfile/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
          </div>
        </div>
</div>
<script src="../../../preview/shared.js"></script>
<script src="./preview.js"></script>
</body></html>
