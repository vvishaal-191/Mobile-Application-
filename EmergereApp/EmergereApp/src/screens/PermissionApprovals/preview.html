<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Permission Approvals - Preview</title>
<link rel="stylesheet" href="../../../preview/base.css"/>
<link rel="stylesheet" href="../LeaveApprovals/preview.css"/>
<link rel="stylesheet" href="./preview.css"/></head>
<body>
<div class="device">
<div class="screen">
  <div class="header"><div class="back-btn">←</div><img class="mini-logo" src="../../../assets/emergere-logo.png" alt="Emergere Logo"/><div><h1>Permission Approvals</h1><p>Short-duration Passes</p></div></div>
    <div class="pill-tabs" id="perm-approval-tabs">
    <div class="pill active" id="perm-tab-pending" onclick="switchPermTab('pending', this)">Pending (<span id="perm-count-pending">0</span>)</div>
    <div class="pill" id="perm-tab-approved" onclick="switchPermTab('approved', this)">Approved (<span id="perm-count-approved">0</span>)</div>
    <div class="pill" id="perm-tab-rejected" onclick="switchPermTab('rejected', this)">Rejected (<span id="perm-count-rejected">0</span>)</div>
  </div>

  <div id="permission-approvals-list">
    <div id="no-perm-msg" style="display:block; text-align:center; padding:30px 20px; color:var(--text-secondary); font-size:14px; background:#fff; margin:0 20px; border-radius:16px; border:1px solid var(--border);">
      No permission requests found in this category.
    </div>
  </div>
</div>
<div class="bottom-nav">
          <div class="tab nav-tab active" id="tab-dashboard">
            <div class="dashboard-pill-wrap">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="#2563EB">
                <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1v-9.5z"></path>
              </svg>
            </div>
            <span>Dashboard</span>
            <span class="active-dot-indicator"></span>
          </div>
          <div class="tab nav-tab" id="tab-attendance" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-TeamAttendance')}else{window.location.href='../TeamAttendance/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="16" y1="2" x2="16" y2="6"></line>
              <line x1="8" y1="2" x2="8" y2="6"></line>
              <line x1="3" y1="10" x2="21" y2="10"></line>
            </svg>
            <span>Attendance</span>
          </div>
          <div class="tab nav-apply-btn-wrap" id="tab-apply" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-ApplyLeave')}else{window.location.href='../ApplyLeave/preview.html'}">
            <div class="nav-apply-circle">
              <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round">
                <line x1="12" y1="5" x2="12" y2="19"></line>
                <line x1="5" y1="12" x2="19" y2="12"></line>
              </svg>
            </div>
            <span class="nav-apply-label">Apply</span>
          </div>
          <div class="tab nav-tab" id="tab-history" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-LeaveHistory')}else{window.location.href='../LeaveHistory/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
              <polyline points="12 7 12 12 15 15"></polyline>
            </svg>
            <span>History</span>
          </div>
          <div class="tab nav-tab" id="tab-profile" onclick="if(window.parent&&window.parent.loadScreen){window.parent.loadScreen('tpl-MyProfile')}else{window.location.href='../MyProfile/preview.html'}">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <span>Profile</span>
          </div>
        </div>
</div>
<script src="../../../preview/shared.js"></script>
<script src="./preview.js"></script>
<script>
let currentPermTab = 'pending';

function switchPermTab(status, el) {
  currentPermTab = status;
  const pills = el.parentElement.querySelectorAll('.pill');
  pills.forEach(p => p.classList.remove('active'));
  el.classList.add('active');
  renderPermissionApprovals();
}

function processPermAction(id, newStatus) {
  const card = document.querySelector(`#permission-approvals-list .approval-card[data-perm-id="${id}"]`);
  if (card) {
    card.setAttribute('data-status', newStatus);
    const actionWrap = card.querySelector('.card-action-wrap');
    if (actionWrap) {
      if (newStatus === 'approved') {
        actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge success">Approved</span></div>';
      } else {
        actionWrap.innerHTML = '<div style="text-align:right; margin-top:8px;"><span class="badge danger">Rejected</span></div>';
      }
    }
    updatePermTabCounts();
    renderPermissionApprovals();
  }

  const permKey = 'perm-' + id;
  if (window.parent && window.parent.loadScreen) {
    if (window.parent.PERSON_DATA && window.parent.PERSON_DATA[permKey]) {
      window.parent.PERSON_DATA[permKey].status = newStatus;
      window.parent.LAST_PERMISSION_DECISION = window.parent.PERSON_DATA[permKey];
      window.parent.LAST_LEAVE_DECISION = window.parent.PERSON_DATA[permKey];
    }
    window.parent.loadScreen('tpl-LeaveApprovalDetail', permKey);
  } else {
    window.location.href = '../LeaveApprovalDetail/preview.html?permId=' + id + '&status=' + newStatus;
  }
}

function updatePermTabCounts() {
  const pending = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="pending"]').length;
  const approved = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="approved"]').length;
  const rejected = document.querySelectorAll('#permission-approvals-list .approval-card[data-status="rejected"]').length;

  const countPending = document.getElementById('perm-count-pending');
  const countApproved = document.getElementById('perm-count-approved');
  const countRejected = document.getElementById('perm-count-rejected');

  if (countPending) countPending.textContent = pending;
  if (countApproved) countApproved.textContent = approved;
  if (countRejected) countRejected.textContent = rejected;
}

function renderPermissionApprovals() {
  let visibleCount = 0;
  const cards = document.querySelectorAll('#permission-approvals-list .approval-card');
  cards.forEach(card => {
    const status = card.getAttribute('data-status');
    if (status === currentPermTab) {
      card.style.display = 'block';
      visibleCount++;
    } else {
      card.style.display = 'none';
    }
  });

  const msg = document.getElementById('no-perm-msg');
  if (msg) {
    msg.style.display = visibleCount === 0 ? 'block' : 'none';
  }
}

document.querySelectorAll('#permission-approvals-list .approval-card').forEach(card => {
  card.style.cursor = 'pointer';
  card.addEventListener('click', function(e) {
    if (e.target.closest('button')) return;
    const id = this.getAttribute('data-perm-id');
    const permKey = 'perm-' + id;
    if (window.parent && window.parent.loadScreen) {
      window.parent.loadScreen('tpl-LeaveApprovalDetail', permKey);
    } else {
      window.location.href = '../LeaveApprovalDetail/preview.html?permId=' + id;
    }
  });
});
</script>
</body></html>
