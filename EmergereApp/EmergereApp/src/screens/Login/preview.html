<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Login - Preview</title>
<link rel="stylesheet" href="../../../preview/base.css" />
<link rel="stylesheet" href="./preview.css" />
</head>
<body>
  <div class="device">
    <div class="screen dark login-screen">
      <img class="logo" src="../../../assets/emergere-logo.png" alt="Emergere" />
      <h1>Welcome Back</h1>
      <p class="subtitle">Log in to manage leaves &amp; attendance</p>

      <div id="login-auth-err" class="error-msg" style="display:none; background:rgba(252,228,228,0.95); color:#E5484D; padding:10px 14px; border-radius:10px; font-size:13px; font-weight:700; margin-bottom:16px; border:1px solid #F87171; text-align:center;">
      </div>

      <div class="field">
        <label class="field-label light">Email Address *</label>
        <div style="position:relative; display:flex; align-items:center;">
          <input type="email" id="email" value="" placeholder="Enter your email address" style="padding-right:48px;" />
          <button type="button" class="search-btn" onclick="openEmpModal()" title="Select predefined employee email" style="position:absolute; right:8px; background:rgba(255,255,255,0.25); border:none; border-radius:8px; width:34px; height:34px; display:flex; align-items:center; justify-content:center; cursor:pointer; color:#FFFFFF; transition:background 0.2s;">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
          </button>
        </div>
      </div>

      <div class="field">
        <label class="field-label light">Password *</label>
        <div class="password-row" style="position:relative; display:flex; align-items:center;">
          <input id="pwd" type="password" placeholder="Enter your password" oninput="updatePasswordEyeVisibility('pwd')" style="padding-right:48px;" />
          <button type="button" id="pwd-eye" class="eye-btn" onclick="toggleVisibility('pwd')" title="View password" style="display:none; position:absolute; right:12px; background:none; border:none; color:#FFFFFF; cursor:pointer; padding:6px; align-items:center; justify-content:center; transition:opacity 0.2s;">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
          </button>
        </div>
        <div id="pwd-error" class="error-msg" style="display:none; color:#FFD1D1; font-size:13px; font-weight:600; margin-top:6px;">
          Password must contain a minimum of 8 characters.
        </div>
      </div>

      <div class="remember-row" onclick="toggleRemember(this)" style="display:flex; align-items:center; gap:10px; margin-bottom:20px; cursor:pointer;">
        <div class="chk-box" style="width:20px; height:20px; border-radius:6px; background:#8EC4EA; border:1.5px solid #FFFFFF; display:flex; align-items:center; justify-content:center; color:#FFFFFF; font-size:12px; font-weight:bold;">✓</div>
        <span style="color:#FFFFFF; font-size:14px; font-weight:500;">Remember me</span>
      </div>

      <button class="btn btn-primary full" onclick="handleLogin()">Login</button>
      <p class="forgot" onclick="openForgotModal()" style="cursor:pointer;">Forgot Password?</p>
    </div>

    <!-- Forgot Password Modal -->
    <div id="forgot-modal" class="modal-overlay" style="display:none;">
      <div class="modal-card">
        <div class="modal-head">
          <h3>Forgot Password?</h3>
          <span class="modal-close" onclick="closeForgotModal()">✕</span>
        </div>
        <p class="modal-sub">Enter your registered Email ID and Contact Number to verify your account.</p>
        
        <div id="modal-err" class="modal-err-box" style="display:none;"></div>

        <div class="modal-field">
          <label>Email ID *</label>
          <input type="email" id="forgot-email" placeholder="Enter your email address" />
        </div>

        <div class="modal-field">
          <label>Contact Number *</label>
          <input type="tel" id="forgot-contact" placeholder="Enter 10-digit contact number" maxlength="10" />
        </div>

        <div class="modal-actions">
          <button class="btn-cancel" onclick="closeForgotModal()">Cancel</button>
          <button class="btn-confirm" onclick="confirmForgot()">Confirm</button>
        </div>
      </div>
    </div>

    <!-- Credentials Selection Modal (Employee & Manager) with Smooth Fade-In & Glow -->
    <div id="emp-modal" class="modal-overlay" onclick="if(event.target===this)closeEmpModal()" style="display:none; position:absolute; top:0; left:0; right:0; bottom:0; background:rgba(13,23,42,0.72); z-index:1000; align-items:center; justify-content:center; padding:16px; opacity:0; transition:opacity 0.3s cubic-bezier(0.16, 1, 0.3, 1), backdrop-filter 0.3s ease; backdrop-filter:blur(5px);">
      <div class="cred-modal-card">
        <div class="modal-head" style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; padding-bottom:2px; flex-shrink:0;">
          <h3 style="margin:0; font-size:16px; font-weight:800; color:#0F172A; letter-spacing:-0.2px;">Login Credentials</h3>
          <span class="modal-close" onclick="closeEmpModal()" style="font-size:18px; color:#64748B; cursor:pointer; font-weight:bold; width:26px; height:26px; display:flex; align-items:center; justify-content:center; border-radius:50%; transition:background 0.2s;" onmouseover="this.style.background='#F1F5F9'" onmouseout="this.style.background='transparent'">✕</span>
        </div>
        
        <div id="emp-list" style="display:flex; flex-direction:column; gap:2px;">
        </div>
      </div>
    </div>
  </div>
  <script src="../../../preview/shared.js"></script>
  <script src="./preview.js"></script>
</body>
</html>
