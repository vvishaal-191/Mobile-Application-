<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Apply Leave - Preview</title>
<link rel="stylesheet" href="../../../preview/base.css"/>
<link rel="stylesheet" href="./preview.css"/></head>
<body>
<div class="device">
<div class="screen">
  <div class="header"><img class="mini-logo" src="../../../assets/emergere-logo.png"/><h1>Apply Leave</h1></div>
  <p class="subtitle">Create new leave request</p>
  <div class="field"><label class="field-label">Leave Type *</label>
    <div class="select-wrap" style="position:relative;">
      <select id="leave-type-select" style="width:100%; border:1px solid var(--border); border-radius:12px; padding:14px 40px 14px 14px; font-size:15px; color:var(--text); background:var(--surface); font-family:inherit; cursor:pointer; appearance:none; -webkit-appearance:none; font-weight:500;">
        <option>Casual Leave</option>
        <option>Sick Leave</option>
        <option>Earned Leave</option>
        <option>Privilege Leave</option>
      </select>
      <div style="position:absolute; right:16px; top:50%; transform:translateY(-50%); pointer-events:none; display:flex; align-items:center; color:#111827;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
  </div>
  <div class="field two-col">
    <div>
      <label class="field-label">From Date *</label>
      <div class="date-input-wrap" onclick="openCalPicker('from-date-picker', this.querySelector('.cal-icon-btn'))">
        <input type="text" id="from-date-display" value="07-Sep-2026" readonly />
        <label for="from-date-picker" class="cal-icon-btn" title="Open Calendar" onclick="event.stopPropagation(); openCalPicker('from-date-picker', this)">
          📅
          <input type="date" id="from-date-picker" value="2026-09-07" onchange="updateLeaveDates()" />
        </label>
      </div>
    </div>
    <div>
      <label class="field-label">To Date *</label>
      <div class="date-input-wrap" onclick="openCalPicker('to-date-picker', this.querySelector('.cal-icon-btn'))">
        <input type="text" id="to-date-display" value="07-Sep-2026" readonly />
        <label for="to-date-picker" class="cal-icon-btn" title="Open Calendar" onclick="event.stopPropagation(); openCalPicker('to-date-picker', this)">
          📅
          <input type="date" id="to-date-picker" value="2026-09-07" onchange="updateLeaveDates()" />
        </label>
      </div>
    </div>
  </div>
  <div class="field half-day-row">
    <div class="half-day-col-left">
      <label class="half-day-label" for="half-day-check">
        <input type="checkbox" id="half-day-check" onchange="toggleHalfDay(this.checked)" style="width:18px;height:18px;accent-color:var(--primary);cursor:pointer;flex-shrink:0;" />
        <span>Half Day</span>
      </label>
    </div>
    <div class="half-day-col-right" id="half-day-type-wrap" style="display:none;">
      <label class="field-label" style="margin-bottom:6px;display:block;">Leave Type <span style="color:var(--danger)">*</span></label>
      <div class="select-wrap" style="position:relative;">
        <select id="half-day-type-select" style="width:100%; height:44px; border:1px solid var(--border); border-radius:12px; padding:0 36px 0 12px; font-size:14px; color:var(--text); background:var(--surface); font-family:inherit; cursor:pointer; appearance:none; -webkit-appearance:none; font-weight:500; transition:border-color 0.25s ease, box-shadow 0.25s ease;">
          <option value="First Half">First Half</option>
          <option value="Second Half">Second Half</option>
        </select>
        <div style="position:absolute; right:12px; top:50%; transform:translateY(-50%); pointer-events:none; display:flex; align-items:center; color:#111827;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
        </div>
      </div>
    </div>
  </div>
  <div class="field"><label class="field-label">Number of Days</label><div class="auto-box" id="days-count-box">1.0 Day (Auto-calculated)</div></div>
  <div class="field"><label class="field-label">Approving Manager</label>
    <div class="select-wrap" style="position:relative;">
      <select id="leave-manager-select" style="width:100%; border:1px solid var(--border); border-radius:12px; padding:14px 40px 14px 14px; font-size:15px; color:var(--text); background:var(--surface); font-family:inherit; cursor:pointer; appearance:none; -webkit-appearance:none; font-weight:500;">
        <option value="Vishnu (Reporting Manager)">Vishnu (Reporting Manager)</option>
        <option value="Ram (Reporting Manager)">Ram (Reporting Manager)</option>
        <option value="Rahul (Reporting Manager)">Rahul (Reporting Manager)</option>
      </select>
      <div style="position:absolute; right:16px; top:50%; transform:translateY(-50%); pointer-events:none; display:flex; align-items:center; color:#111827;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>
      </div>
    </div>
  </div>
  <div class="field"><label class="field-label">Reason *</label><textarea rows="4" placeholder="Describe the reason for your leave..."></textarea></div>
  <div class="field"><label class="field-label">Supporting Document</label><div class="upload-box">☁️ Click to upload (PDF, JPEG, max 5MB)</div></div>
  <div class="field"><label class="field-label">Contact Info During Leave</label><input placeholder="Emergency contact or location details"/></div>
  <button class="btn btn-primary full" id="leave-submit-btn" onclick="submitLeaveRequest()">Submit Request</button>
</div>
<div class="bottom-nav">
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect></svg></span>Dashboard</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>Attendance</div>
  <div class="tab active"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg></span>Apply</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><polyline points="12 7 12 12 15 15"></polyline></svg></span>History</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg></span>Profile</div>
</div>
<!-- Success Popup Modal -->
<div class="success-modal-overlay" id="leave-success-modal" onclick="if(event.target===this)closeLeaveSuccessModal()">
  <div class="success-modal-card">
    <div class="success-modal-icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2 class="success-modal-title">Request Submitted!</h2>
    <p class="success-modal-msg">Your leave request has been submitted successfully.</p>
    <button class="success-modal-btn" onclick="closeLeaveSuccessModal()">Done</button>
  </div>
</div>
</div>
<script src="../../../preview/shared.js"></script>
<script src="./preview.js"></script>
<script>
function toggleHalfDay(isChecked) {
  var wrap = document.getElementById('half-day-type-wrap');
  var daysBox = document.getElementById('days-count-box');
  if (wrap) wrap.style.display = isChecked ? 'block' : 'none';
  if (isChecked && daysBox) {
    daysBox.textContent = '0.5 Day (Half Day)';
  } else if (!isChecked && daysBox) {
    daysBox.textContent = '1.0 Day (Auto-calculated)';
  }
}
function submitLeaveRequest() {
  var modal = document.getElementById('leave-success-modal');
  if (modal) modal.classList.add('show');
}
function closeLeaveSuccessModal() {
  var modal = document.getElementById('leave-success-modal');
  if (modal) modal.classList.remove('show');
  if (window.parent && window.parent.loadScreen) {
    window.parent.loadScreen('tpl-EmployeeDashboard');
  } else {
    location.href = '../EmployeeDashboard/preview.html';
  }
}
</script>
</body></html>
