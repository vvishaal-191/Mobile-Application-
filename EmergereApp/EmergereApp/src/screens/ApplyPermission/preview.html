<!DOCTYPE html><html><head><meta charset="UTF-8"/><title>Apply Permission - Preview</title>
<link rel="stylesheet" href="../../../preview/base.css"/>
<link rel="stylesheet" href="../ApplyLeave/preview.css"/>
<link rel="stylesheet" href="./preview.css"/></head>
<body>
<div class="device">
<div class="screen">
  <div class="header"><img class="mini-logo" src="../../../assets/emergere-logo.png"/><h1>Apply Permission</h1></div>
  <p class="subtitle">Request short duration permission</p>
  <div class="field">
    <label class="field-label">Date *</label>
    <input type="date" id="perm-date-input" value="2026-09-04" style="width:100%; border:1px solid var(--border); border-radius:12px; padding:14px; font-size:15px; color:var(--text); background:var(--surface); font-family:inherit; cursor:pointer;"/>
  </div>
  <div class="field"><label class="field-label">Permission Type *</label>
    <div class="select-wrap">
      <select id="perm-type-select"><option>Early Going</option><option>Late Coming</option><option>Personal Work</option><option>Official Work</option></select>
      <div class="select-chevron">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
  </div>

  <div class="field"><label class="field-label">Duration *</label><input type="text" id="perm-duration-input" value="2 Hours" placeholder="E.g., 2 Hours" style="width:100%; border:1px solid var(--border); border-radius:12px; padding:14px; font-size:15px; color:var(--text); background:var(--surface); font-family:inherit;"/></div>
  <div class="field"><label class="field-label">Reason *</label><textarea rows="4" placeholder="E.g., Medical checkup, personal work..."></textarea></div>
  <div class="field"><label class="field-label">Approving Manager</label>
    <div class="select-wrap">
      <select id="perm-manager-select"><option value="Vishnu">Vishnu</option><option value="Ram">Ram</option><option value="Rahul">Rahul</option></select>
      <div class="select-chevron">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="6 9 12 15 18 9"></polyline>
        </svg>
      </div>
    </div>
  </div>
  <button class="btn btn-primary full" id="perm-submit-btn" onclick="submitPermRequest()">Submit Request</button>
</div>
<div class="bottom-nav">
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="3" width="7" height="7" rx="2"></rect><rect x="14" y="14" width="7" height="7" rx="2"></rect><rect x="3" y="14" width="7" height="7" rx="2"></rect></svg></span>Dashboard</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg></span>Attendance</div>
  <div class="tab active"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"></circle><line x1="12" y1="8" x2="12" y2="16"></line><line x1="8" y1="12" x2="16" y2="12"></line></svg></span>Apply</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path><path d="M3 3v5h5"></path><polyline points="12 7 12 12 15 15"></polyline></svg></span>History</div>
  <div class="tab"><span class="icon"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" y1="6" x2="20" y2="6"></line><line x1="4" y1="12" x2="20" y2="12"></line><line x1="4" y1="18" x2="20" y2="18"></line></svg></span>Profile</div>
</div>
<!-- Success Popup Modal -->
<div class="success-modal-overlay" id="perm-success-modal" onclick="if(event.target===this)closePermSuccessModal()">
  <div class="success-modal-card">
    <div class="success-modal-icon-wrap">
      <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <h2 class="success-modal-title">Request Submitted!</h2>
    <p class="success-modal-msg">Your permission request has been submitted successfully.</p>
    <button class="success-modal-btn" onclick="closePermSuccessModal()">Done</button>
  </div>
</div>
</div>
<script src="../../../preview/shared.js"></script>
<script src="./preview.js"></script>
<script>
function submitPermRequest() {
  var modal = document.getElementById('perm-success-modal');
  if (modal) modal.classList.add('show');
}
function closePermSuccessModal() {
  var modal = document.getElementById('perm-success-modal');
  if (modal) modal.classList.remove('show');
  if (window.parent && window.parent.loadScreen) {
    window.parent.loadScreen('tpl-EmployeeDashboard');
  } else {
    location.href = '../EmployeeDashboard/preview.html';
  }
}
</script>
</body></html>
